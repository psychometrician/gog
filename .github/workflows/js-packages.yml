# Build one npm package per platform, each carrying the engine it needs.
#
# The JavaScript package is a bridge to `gog-cli`, so a package without that
# binary installs and then cannot draw. The engine therefore ships beside it as
# five small packages named `grammar-of-graphics-<platform>-<arch>`, listed under
# the main package's `optionalDependencies` and filtered by npm's `os`/`cpu`
# fields, so an install downloads exactly one 2 MB engine. It is the same
# decision the Python wheels make, written the way npm already understands.
#
# `js-pkg/gog/tools/platform-package.mjs` does the packing. This builds the
# binary for each target, hands it to that script, and then asks the result the
# only question that settles it: installed somewhere with no checkout in sight,
# does it draw?
#
# **The Linux builds target musl, and that is deliberate rather than incidental.**
# Half of Node's Linux audience runs in Alpine containers, where a glibc-linked
# binary dies with a message about a missing loader that names nothing the user
# can act on. `gog-cli` depends on nothing but serde, so a statically linked musl
# build costs nothing and covers glibc and musl with one artifact. The Python
# wheels cannot do this — manylinux is what PyPI understands — so this is one
# place the two release paths correctly differ.
#
# This uploads artifacts and stops. `js-release.yml` calls it and publishes what
# comes out, so the two triggers stay separate: every pull request proves the
# packages still build, and only a tag sends them anywhere.

name: js packages

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "js-pkg/**"
      - "gog-core/**"
      - "gog-cli/**"
      - ".github/workflows/js-packages.yml"

jobs:
  engines:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          # Cross-compiled from the Apple Silicon runner rather than built on
          # `macos-13`. That image is the last Intel one and GitHub is retiring
          # it; the Python matrix had a job sit queued 55 minutes on it and never
          # start. A release that waits on a scarce runner is a release that does
          # not ship.
          - os: macos-14
            target: darwin-x64
            rust_target: x86_64-apple-darwin
            macos_target: "10.12"
          - os: ubuntu-latest
            target: linux-x64
            rust_target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: win32-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Pure Rust needs no C toolchain, but the musl targets still link through a
      # `musl-gcc` that the runner images do not carry.
      - name: Install the musl toolchain
        if: ${{ contains(matrix.rust_target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add the target
        if: ${{ matrix.rust_target }}
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build the engine
        shell: bash
        run: |
          # Exported here rather than in an `env:` block, and only when the matrix
          # entry actually names one. An `env:` value read from an undefined matrix
          # key is not absent, it is the **empty string**, and rustc rejects that
          # for an Apple target: `failed to parse deployment target specified in
          # MACOSX_DEPLOYMENT_TARGET: cannot parse integer from empty string`.
          # Only `darwin-x64` names a target, so the one job this broke was
          # `darwin-arm64` — Linux and Windows never read the variable at all,
          # which is why the failure looked target-specific rather than structural.
          if [ -n "${{ matrix.macos_target }}" ]; then
            export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macos_target }}"
          fi

          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo build --release -p gog-cli --target "${{ matrix.rust_target }}"
            echo "ENGINE=$PWD/target/${{ matrix.rust_target }}/release/gog-cli" >> "$GITHUB_ENV"
          else
            cargo build --release -p gog-cli
            echo "ENGINE=$PWD/target/release/gog-cli" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The Windows engine is `gog-cli.exe`, and the build wrote it under that
      # name; every other target has no suffix. The generator reads the platform
      # out of its first argument and expects the path it is given to exist.
      - name: Build the platform package
        shell: bash
        working-directory: js-pkg/gog
        run: |
          ENGINE_PATH="$ENGINE"
          [ "${{ matrix.target }}" = "win32-x64" ] && ENGINE_PATH="$ENGINE.exe"
          node tools/platform-package.mjs "${{ matrix.target }}" "$ENGINE_PATH"
          cd "dist/grammar-of-graphics-${{ matrix.target }}"
          # `npm pack` does not create `--pack-destination`; it opens the tarball
          # inside it and fails with a bare `ENOENT ... open`. The generator writes
          # under `js-pkg/gog/dist/`, so the collection directory at the workspace
          # root — which `upload-artifact` reads as `dist/*.tgz` — has never been
          # made by anything.
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      # The check that matters: install what was just built somewhere with no
      # checkout above it, unset every hint, and draw.
      #
      # Both tarballs are installed explicitly rather than letting npm resolve
      # the optional dependency, because at release time the platform package is
      # not on the registry yet — this job is what decides whether it goes there.
      # Resolution is still what is under test: the assertion is that the engine
      # the binding found is *inside the platform package*, so a stray `gog-cli`
      # on PATH cannot pass this for it.
      #
      # The cross-compiled Intel package asks a different question, and the first
      # three attempts at this step all assumed it asked the same one.
      #
      # `find_gog_cli()` resolves the engine for **the machine it is running on**.
      # On an Apple Silicon runner it computes `grammar-of-graphics-darwin-arm64`
      # and will never select the Intel package, no matter what is installed.
      # Rosetta does not change that: the runner's `node` is arm64, so
      # `process.arch` is `arm64` inside it too. Npm agrees from the other side and
      # refuses the install outright with `EBADPLATFORM`, on metadata, before
      # anything executes — `--force` gets past that, and then resolution fails as
      # described. So the resolution half of this check is not merely awkward on
      # this runner, it is unreachable, and it was never going to pass.
      #
      # What is reachable is the engine itself, and that is what the Intel branch
      # below proves: the packed tarball carries a real x86_64 binary, and that
      # binary accepts the current wire format and returns SVG when run under
      # Rosetta. Resolution is exercised natively by the other four targets, which
      # run the identical code path on their own architecture.
      #
      # The payload is generated by the binding being shipped rather than frozen
      # into this file, so it cannot drift from the wire format it is testing.
      - name: Prove it draws with no toolchain and no checkout
        shell: bash
        env:
          PLATFORM_PACKAGE: grammar-of-graphics-${{ matrix.target }}
        run: |
          set -euo pipefail
          PACKED="$(ls "$GITHUB_WORKSPACE"/dist/grammar-of-graphics-${{ matrix.target }}-*.tgz)"
          MAIN="$(cd js-pkg/gog && npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"

          WORK="$RUNNER_TEMP/check"
          rm -rf "$WORK"; mkdir -p "$WORK"
          cd "$WORK"
          npm init -y > /dev/null

          if [ "${{ matrix.target }}" = "darwin-x64" ]; then
            file "$ENGINE"
            file "$ENGINE" | grep -q "executable x86_64" \
              || { echo "::error::the darwin-x64 package does not carry an x86_64 engine"; exit 1; }

            if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::error::Rosetta is absent, so the Intel engine cannot be exercised at all"
              exit 1
            fi

            # The engine out of the tarball that would be published, not the one
            # left in target/ by the build.
            tar -xzf "$PACKED" -C "$WORK"
            INTEL="$WORK/package/bin/gog-cli"
            test -x "$INTEL" || { echo "::error::no engine at bin/gog-cli in the tarball"; exit 1; }

            # The binding is pure JavaScript and runs fine here; only its engine is
            # the wrong architecture. So let it build the request, capture that on
            # the way out, and hand it to the Intel engine directly.
            npm install --no-audit --no-fund "$RUNNER_TEMP/$MAIN" > /dev/null
            { echo '#!/bin/sh'
              echo 'cat > "$GOG_CAPTURE"'
              echo 'echo "<svg/>"'; } > capture
            chmod +x capture
            cat > payload.mjs <<'EOF'
          import { plot, data, line, x, y, col, render_svg } from "grammar-of-graphics";
          render_svg(plot(data({ a: [1, 2], b: [3, 4] }, { name: "t" }),
                          line, x(col.a), y(col.b)));
          EOF
            GOG_CLI_PATH="$PWD/capture" GOG_CAPTURE="$PWD/spec.json" node payload.mjs
            test -s spec.json || { echo "::error::the binding produced no request"; exit 1; }

            arch -x86_64 "$INTEL" < spec.json > out.svg
            head -c 4 out.svg | grep -q '<svg' \
              || { echo "::error::the Intel engine did not return SVG"; head -c 300 out.svg; exit 1; }
            echo "the packed Intel engine drew $(wc -c < out.svg | tr -d ' ') bytes under Rosetta"

            echo "::warning::grammar-of-graphics-darwin-x64: the engine is verified (real x86_64, accepts the wire format, draws under Rosetta) but npm resolution is not, and cannot be on an arm64 runner - find_gog_cli() resolves for the running machine. The other four targets cover resolution natively."
            exit 0
          fi

          npm install --no-audit --no-fund "$RUNNER_TEMP/$MAIN" "$PACKED"

          cat > draw.mjs <<'EOF'
          import process from "node:process";
          import { plot, data, line, x, y, col, render_svg, find_gog_cli }
            from "grammar-of-graphics";

          const engine = find_gog_cli();
          console.log("engine:", engine);
          if (!engine.includes(process.env.PLATFORM_PACKAGE)) {
            console.error(`the engine did not come from ${process.env.PLATFORM_PACKAGE}`);
            process.exit(1);
          }

          const svg = render_svg(plot(
            data({ a: [1, 2], b: [3, 4] }, { name: "t" }), line, x(col.a), y(col.b)));
          if (!svg.startsWith("<svg")) {
            console.error(svg.slice(0, 200));
            process.exit(1);
          }
          console.log("drew", svg.length, "bytes with the shipped engine");
          EOF

          unset GOG_CLI_PATH
          node draw.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: dist/*.tgz

  # The main package is pure JavaScript and platform-independent, so it is packed
  # once rather than five times. The platform jobs each pack their own copy for
  # the draw test above; only this one is published.
  main:
    name: the binding itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The suite draws. Most of these tests send a plot to the engine and compare
      # what comes back, so without a `gog-cli` 47 of the 75 fail with `gog: cannot
      # find the gog-cli binary` — which is what this job did on its first ever run.
      # The binding package is pure JavaScript and carries no engine itself, so one
      # has to be built here; the platform jobs above each build their own.
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The suite draws with `gog-cli`, and the package ships the browser
          # build beside it. Targets can only be added by the toolchain action.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build an engine for the suite to draw with
        shell: bash
        run: |
          cargo build --release -p gog-cli
          echo "GOG_CLI_PATH=$PWD/target/release/gog-cli" >> "$GITHUB_ENV"

      # The glob, not `node --test test/`. Handed a directory this runner tries to
      # import the path as a module and dies on `Cannot find module …/test`, which
      # is how `npm test` here was broken without anyone noticing: the documented
      # command has always been the glob, so nothing ran the other form.
      # The browser engine goes in the *main* package rather than the five
      # platform ones, and that is the whole difference between it and `gog-cli`.
      # WebAssembly is portable, so one file serves every platform and there is
      # no matrix to keep in step — the reason the engine needs five packages
      # does not apply to it at all.
      #
      # `interactive.js` already ships: it is source, and `src/` is published.
      # Only the compiled module has to be staged, into `www/`, which
      # `package.json` lists under `files` and `findWasmAssets` looks in first.
      - name: Stage the browser engine
        shell: bash
        run: |
          cargo build --release --target wasm32-unknown-unknown \
            --manifest-path gog-wasm/Cargo.toml
          mkdir -p js-pkg/gog/www
          cp gog-wasm/target/wasm32-unknown-unknown/release/gog_wasm.wasm \
             js-pkg/gog/www/gog.wasm
          test -f js-pkg/gog/www/gog.wasm

      - name: Test and pack
        working-directory: js-pkg/gog
        shell: bash
        run: |
          node --test test/*.mjs
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"
          # Assert rather than assume. `files` decides what npm includes, and a
          # typo there is not an error anywhere — it is a published package that
          # installs cleanly and whose 3-D plots quietly do not turn.
          tar -tzf "$GITHUB_WORKSPACE"/dist/grammar-of-graphics-[0-9]*.tgz \
            | grep -q "package/www/gog.wasm" \
            || { echo "::error::the npm tarball has no www/gog.wasm"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: npm-main
          path: dist/*.tgz
