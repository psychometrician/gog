# Run every suite the project is held to, on every push and pull request.
#
# The discipline this guards is the one the project is built on: four bindings
# are one grammar with four spellings, and a binding left behind is supposed to
# show up as a disagreement rather than as a small debt. Until now that was
# enforced by a person running seven commands in order. A stranger's pull request
# had nothing checking it at all.
#
# Two layers, because they answer different questions:
#
#   bindings — does each binding still pass its own suite? Four jobs so a failure
#              names the language rather than stopping at the first one.
#   parity   — do all four draw the *same sentence* identically? Every sentence in
#              the manual, re-recorded from R and compared. This is the check that
#              actually settles "done", and the one no single suite can make.
#
# The engine is built once and passed along as an artifact. That is not only
# speed: it means every job tests the same binary, which is the thing a user
# receives, rather than five separately compiled ones.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    # **A compiler warning fails this job, and until now nothing could.**
    # `cargo build` and `cargo test` both exit 0 with warnings, so a warning had
    # no way to stop anything here — the same blind spot as a Quarto render
    # exiting 0 on a dead link. Worse, it is invisible where the work happens:
    # a local build is incremental, so a warning is printed once and never again
    # until that crate recompiles. The person who reliably sees one is therefore
    # a *user*, because r-universe and a source install compile from scratch
    # every time. An unused `mut` reached one that way.
    #
    # It belongs on the job and not in `Cargo.toml`. A `[lints]` table denying
    # warnings would ship: one new lint in one new Rust release, and every
    # source install breaks for everyone. Denied here it fails us instead, which
    # is the right party. `RUSTFLAGS` is part of cargo's fingerprint, so this
    # forces one full rebuild and thereafter no cached unit can slip past it.
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The engine is built twice: once for the bindings to spawn, once for a
          # browser to run. The toolchain action is the only place a target can be
          # added; a later `cargo build --target` cannot install one.
          targets: wasm32-unknown-unknown

      - name: Test the engine
        run: cargo test --release

      # A green `cargo test` does not mean this binary was rebuilt — the test
      # harness and the CLI are separate artifacts, and that gap once hid a stale
      # binary for a whole session. Build it explicitly and assert it exists.
      - name: Build the engine the bindings will use
        run: |
          cargo build --release -p gog-cli
          test -x target/release/gog-cli

      # The browser build of the same engine. `cargo test --release` above does
      # not reach it: `gog-wasm` is deliberately outside the workspace, for the
      # two reasons its manifest records. So it is built and tested here by name,
      # and the artifact is uploaded because the JavaScript job needs it to check
      # that both bridges draw the same picture.
      - name: Test and build the engine the browser runs
        run: |
          cargo test --release --manifest-path gog-wasm/Cargo.toml
          cargo build --release --target wasm32-unknown-unknown \
            --manifest-path gog-wasm/Cargo.toml
          test -f gog-wasm/target/wasm32-unknown-unknown/release/gog_wasm.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: gog-wasm
          path: gog-wasm/target/wasm32-unknown-unknown/release/gog_wasm.wasm
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gog-cli
          path: target/release/gog-cli

  bindings:
    name: ${{ matrix.name }}
    needs: engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: R
            lang: r
          - name: Python
            lang: python
          - name: JavaScript
            lang: js
          - name: Julia
            lang: julia
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/engine

      - if: matrix.lang == 'r'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # `pkgload` is what makes the suite honor the hand-written NAMESPACE, so a
      # missing export fails at load time instead of passing invisibly. The other
      # three are what the book's own checks need, which this suite runs.
      - if: matrix.lang == 'r'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: pkgload, jsonlite, knitr, gapminder
      - if: matrix.lang == 'r'
        run: Rscript r-pkg/gog/tests/test_basic.R

      # No dependencies on purpose: the binding reads a table by duck-typing, so
      # pandas is supported without being required, and the suite proves that by
      # importing neither.
      - if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: matrix.lang == 'python'
        run: python3 py-pkg/gog/tests/test_basic.py

      - if: matrix.lang == 'js'
        uses: actions/setup-node@v4
        with:
          # 22, not 20, because `node:sqlite` is what `query()`'s guard draws
          # against and it is a built-in only from 22 — on 20 the import dies with
          # `ERR_UNKNOWN_BUILTIN_MODULE` before a single test runs. Choosing a
          # standard module over an npm driver is the whole reason JavaScript tests
          # `query()` against a real database with no dependency, the way Python
          # does with `sqlite3`; the floor is the price of that.
          node-version: "22"
      # Without this the WebAssembly/CLI byte-parity test *skips*, loudly but
      # harmlessly, and the one check that can catch the two bridges drifting
      # would protect nothing in CI.
      - if: matrix.lang == 'js'
        uses: actions/download-artifact@v4
        with:
          name: gog-wasm
          path: gog-wasm/target/wasm32-unknown-unknown/release
      - if: matrix.lang == 'js'
        run: |
          test -f gog-wasm/target/wasm32-unknown-unknown/release/gog_wasm.wasm
          node --test js-pkg/gog/test/*.mjs

      - if: matrix.lang == 'julia'
        uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - if: matrix.lang == 'julia'
        run: julia --project=jl-pkg/GrammarOfGraphics jl-pkg/GrammarOfGraphics/test/runtests.jl

  parity:
    name: every sentence, all four bindings
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/engine

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: pkgload, jsonlite, knitr, gapminder
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          # 22, not 20, because `node:sqlite` is what `query()`'s guard draws
          # against and it is a built-in only from 22 — on 20 the import dies with
          # `ERR_UNKNOWN_BUILTIN_MODULE` before a single test runs. Choosing a
          # standard module over an npm driver is the whole reason JavaScript tests
          # `query()` against a real database with no dependency, the way Python
          # does with `sqlite3`; the floor is the price of that.
          node-version: "22"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      # `book/R/setup.R` shells out to `python3` to build the language tabs, and
      # the Python chapter runs a real subprocess. Node and Julia are *not* needed
      # for that — their tabs are emitted by R in-process — but both are needed
      # below to run their own parity harness.
      - name: pandas, for the book's Python chapter
        run: python3 -m pip install --upgrade pip pandas

      # Re-record first, always. The corpus is R's answer for every sentence in
      # the manual, so a corpus older than the engine would have all three
      # harnesses agreeing with a plot the engine no longer draws.
      - name: Re-record the corpus from the manual
        run: Rscript py-pkg/gog/tests/book_parity/extract.R

      - name: Python draws every sentence
        run: python3 py-pkg/gog/tests/book_parity/run.py
      - name: JavaScript draws every sentence
        run: node js-pkg/gog/test/book_parity/run.mjs
      # The only environment here that needs resolving. The package itself depends
      # on `Dates` alone — a standard library — which is why its suite runs with no
      # setup at all; this harness reads the corpus, so it wants `JSON` from the
      # registry. Its `Manifest.toml` is committed for exactly this reason, and
      # records `GrammarOfGraphics` as a relative path, so the version under test
      # is the checkout rather than a release.
      # `instantiate` only, and **not** `resolve`. Resolving needs a package
      # registry, and this runner has none: a complete manifest pins every
      # version and a path, so nothing has to be looked up. That is the whole
      # reason the manifest is committed, and adding `Pkg.resolve()` here broke
      # the job with `no registries have been installed` while trying to protect
      # it.
      #
      # What it was trying to protect against is real, though. `instantiate`
      # installs what the manifest says without reconsidering it, so when
      # `GrammarOfGraphics` — a *path* dependency — gains a dependency of its
      # own, a stale manifest still records the old list. This step then passes
      # and the *next* one dies on `using GrammarOfGraphics`, complaining that a
      # package does not have a dependency it plainly declares. That is what
      # happened when Base64 and Random arrived with the turnable cube.
      #
      # So the manifest is checked against the package instead, by reading two
      # TOML files. No registry, no network, and the message says what to do.
      - name: Resolve the parity harness's environment
        run: |
          julia --project=jl-pkg/GrammarOfGraphics/test/book_parity \
                -e 'using Pkg; Pkg.instantiate()'
          julia -e '
            using TOML
            pkg = TOML.parsefile("jl-pkg/GrammarOfGraphics/Project.toml")
            man = TOML.parsefile("jl-pkg/GrammarOfGraphics/test/book_parity/Manifest.toml")
            entry = man["deps"]["GrammarOfGraphics"][1]
            pinned = sort(get(entry, "deps", String[]))
            actual = sort(collect(keys(pkg["deps"])))
            if pinned != actual
                println("::error::the parity harness pins GrammarOfGraphics deps ",
                        pinned, " but the package declares ", actual,
                        " — run Pkg.resolve() in jl-pkg/GrammarOfGraphics/test/book_parity ",
                        "and commit the Manifest.toml")
                exit(1)
            end
            println("the harness manifest matches the package: ", actual)'

      - name: Julia draws every sentence
        run: |
          julia --project=jl-pkg/GrammarOfGraphics/test/book_parity \
                jl-pkg/GrammarOfGraphics/test/book_parity/run.jl
