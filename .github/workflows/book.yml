# Render the manual and publish it to https://psychometrician.github.io/gog-book/
#
# The site repository holds *only* the rendered HTML. The book's sources live here
# beside the engine, and stay here: every plot is drawn by `gog-cli` at render
# time, roughly 700 times per build, so one engine change invalidates every page
# at once. Splitting them would turn that into a version-matching problem.
#
# This is `book/publish.sh` as a job, and every guard in that script is repeated
# here for the same measured reason. Four of them are worth naming up front,
# because each one is a way this can appear to succeed while shipping a broken
# book:
#
#   * `cargo test` passing does not mean `target/release/gog-cli` was rebuilt.
#     The test harness and the CLI are separate artifacts, and that gap once hid
#     a stale binary for a whole session. The build is explicit and asserted.
#   * `quarto render` exits 0 with broken links, and writes `WARN:` rather than
#     `warning:`. The exit code proves nothing, so the log is graded — narrowly,
#     see below.
#   * the language-tab translator fails *soft*. `book/R/tabs.R` warns and returns
#     `NULL`, so the book renders R-only and the whole job still exits 0. Three of
#     the four bindings would vanish from the manual with nothing red anywhere.
#     That warning is therefore matched by name and made fatal.
#   * GitHub Pages runs Jekyll, which strips `site_libs/`. Without `.nojekyll`
#     every stylesheet 404s and the site serves unstyled.
#
# Why the whole book, every time: Quarto tracks `.qmd` dependencies, not the
# binary. A per-chapter render leaves the untouched chapters showing plots the
# engine no longer draws.

name: book

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "gog-core/**"
      - "gog-cli/**"
      # The browser half of the engine. The job builds gog-wasm and stages
      # interactive.js/view.js from js-pkg, and asserts all three reached
      # _book/ — so a push touching only these must republish too, or the
      # site serves an old browser engine against a moved gog-cli.
      - "gog-wasm/**"
      - "js-pkg/gog/src/**"
      - "r-pkg/**"
      - "py-pkg/**"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and the newest push wins. The site is a single orphan
# commit force-pushed over whatever was there, so two concurrent runs would race
# to be last rather than merge.
concurrency:
  group: book
  cancel-in-progress: true

jobs:
  book:
    name: render and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The published book carries a second build of the engine, for the
          # browser. Declared here because the toolchain action installs targets
          # and a later `cargo build --target` cannot.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Build the engine that draws every plot
        run: |
          cargo build --release -p gog-cli
          test -x target/release/gog-cli

      # The engine again, compiled for the browser. This is what lets a reader
      # drag a 3-D plot to a different viewing angle on the published site; the
      # binary above only ever draws the still picture.
      #
      # A separate invocation because `gog-wasm` is deliberately outside the
      # workspace — `cargo build --release` does not reach it, and that is not an
      # oversight to be corrected here. Its manifest records the two reasons.
      #
      # **The `test -f` is the point of this step.** Without an engine the book
      # still renders, correctly, with static cubes: `R/setup.R` reports the
      # absence and carries on, which is right for a checkout and wrong for a
      # release. A publish that quietly drops the interactivity would look
      # exactly like a successful one, so the build fails here instead.
      - name: Build the engine the browser runs
        run: |
          cargo build --release --target wasm32-unknown-unknown \
            --manifest-path gog-wasm/Cargo.toml
          test -f gog-wasm/target/wasm32-unknown-unknown/release/gog_wasm.wasm

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # `gapminder` is the book's data set, `jsonlite` is how the R binding
      # reaches the engine, `knitr` renders the chunks, and `magrittr` is needed
      # because `bindings/r.qmd` demonstrates `%>%` in a *live* chunk — the
      # chapter's whole point is that the magrittr pipe loses the table's name,
      # which cannot be shown without the package installed.
      #
      # `rmarkdown` is the one no amount of reading the book will reveal. Quarto's
      # knitr engine shells out to it to execute an `{r}` chunk, so nothing in
      # `book/` ever writes `library(rmarkdown)` and a search for the book's
      # dependencies does not find it. Its absence is not a missing plot either:
      # the render dies on `index.qmd`, chapter 1 of 56, with `Broken pipe` and
      # then explains itself. That is how this list was found to be short.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # `DBI` and `RSQLite` are the two the book's own text does not reveal
          # either, for the opposite reason `rmarkdown` does not: `data.qmd` builds
          # a real in-memory database so `query()` can be taught against one rather
          # than described, and a chunk that calls `DBI::dbConnect` needs both
          # present even though no chapter ever writes `library(DBI)`. Without them
          # the render dies at `data.qmd`, chapter 6, and takes the site with it.
          packages: any::gapminder, any::jsonlite, any::knitr, any::magrittr, any::rmarkdown, any::DBI, any::RSQLite

      # pandas and nothing else. `bindings/python.qmd` runs real pandas examples,
      # and the language tabs shell out to a translator — but neither needs the
      # `gog` package *installed*: `book/R/python.R` reaches the binding through
      # `sys.path.insert(0, py-pkg/gog)`, and `book/R/tabs.R`'s driver imports
      # `translate.py`, which uses only `ast`, `re` and `typing`. Installing the
      # wheel here would invoke its build hook and demand an engine path for
      # nothing.
      #
      # **A virtual environment built from the system interpreter, and deliberately
      # not `actions/setup-python`.** The tool-cache interpreter is dynamically
      # linked against a `libpython` that is only findable through the
      # `LD_LIBRARY_PATH` that action exports, and that variable does not survive
      # into every subprocess: with it, `import pandas` worked from `Rscript`; under
      # `quarto render` the same interpreter, holding the same pandas, failed. The
      # system interpreter's `libpython` sits where the loader looks anyway, so a
      # venv over it does not depend on an inherited variable to start.
      #
      # `pip install --upgrade pip` is also deliberately absent. Fresh venv, no
      # reason to; and doing it in the same command as another package makes pip
      # replace itself mid-transaction, which is its own source of trouble.
      #
      # Pinning `GOG_BOOK_PYTHON` rather than letting `book/R/python.R` fall back to
      # `Sys.which("python3")` removes the resolution question instead of answering
      # it: the interpreter pandas went into is the interpreter the book uses, by
      # absolute path.
      - name: pandas, for the book's Python chapter
        shell: bash
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/bookenv"
          "$RUNNER_TEMP/bookenv/bin/pip" install --quiet pandas
          echo "GOG_BOOK_PYTHON=$RUNNER_TEMP/bookenv/bin/python" >> "$GITHUB_ENV"

      # Julia and Node, and the design this workflow came from said neither was
      # needed. That reasoning counted chunk *languages* — the book has ~1,200
      # `{r}` chunks and no `{julia}`, `{python}` or `{js}` chunks at all — and
      # concluded the other runtimes were unnecessary. But `bindings/julia.qmd` and
      # `bindings/javascript.qmd` do not *show* Julia and JavaScript, they *run*
      # them: an `{r}` chunk calls `jl_run()` or its JavaScript counterpart, which
      # shells out to `julia` or `node`, builds the specification with that
      # language's binding and prints the SVG. Counting chunk languages is exactly
      # the wrong way to find that out. Only the language *tabs* on other chapters
      # are emitted by R in-process.
      #
      # The versions are pinned rather than left to the image. `julia.R` resolves
      # `Sys.which("julia")`, the runner already carries a Julia of its own, and
      # that one segfaulted after forty-five seconds of precompiling — so a chapter
      # documented as a refusal "did not refuse", because a crash is not a refusal.
      # `tests.yml` runs the Julia suite green on `version: "1"`, so the book gets
      # the same one, and `GOG_BOOK_JULIA` names it by absolute path so PATH order
      # cannot decide which Julia draws the book.
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Julia is reached through a wrapper that clears `LD_LIBRARY_PATH`, and that
      # one line is the whole reason `bindings/julia.qmd` can render here.
      #
      # R prepends its own library directory to `LD_LIBRARY_PATH` at startup, so a
      # Julia launched from an R chunk inherits
      # `/opt/R/<ver>/lib/R/lib:/usr/local/lib:/usr/lib/x86_64-linux-gnu:...`.
      # Julia ships its own `libstdc++` and `libgcc` and expects to find them by its
      # own RPATH; with those directories ahead of it the loader hands it the
      # system copies instead, and it dies of SIGSEGV. Julia's own documentation
      # warns against setting `LD_LIBRARY_PATH` for exactly this reason.
      #
      # It presented as `bindings/julia.qmd` reporting that a sentence "documented
      # as a refusal did not refuse", because a crash is not a refusal. The tell was
      # that the *same* case, `@refuses x("gdp")` at `runtests.jl:141`, passes in
      # `tests.yml` on this same runner — where R is not in the chain and nothing has
      # touched `LD_LIBRARY_PATH`.
      #
      # `GOG_BOOK_JULIA` is the override `julia.R` already honors, so this needs no
      # change to the book.
      - name: Pin the interpreters the binding chapters run
        shell: bash
        run: |
          JULIA="$(command -v julia)"
          { echo '#!/bin/sh'
            echo 'unset LD_LIBRARY_PATH'
            echo "exec $JULIA \"\$@\""; } > "$RUNNER_TEMP/julia-clean"
          chmod +x "$RUNNER_TEMP/julia-clean"

          echo "GOG_BOOK_JULIA=$RUNNER_TEMP/julia-clean" >> "$GITHUB_ENV"
          echo "GOG_BOOK_JULIA_RAW=$JULIA" >> "$GITHUB_ENV"
          echo "GOG_BOOK_NODE=$(command -v node)" >> "$GITHUB_ENV"
          julia --version
          node --version

      - uses: quarto-dev/quarto-actions/setup@v2

      # This has to run **through quarto**, and the reason is a check that lied.
      #
      # An earlier version asked the same question from `Rscript` and passed, while
      # the render then failed at `bindings/python.qmd` with the very error the
      # check exists to catch. Three environments are involved, not two: bash, R
      # launched from bash, and R launched by quarto's knitr engine. Only the third
      # one is the book's, and it was the only one not being asked.
      #
      # A guard that passes when the thing it guards fails is worse than no guard,
      # so the probe is a real `.qmd` rendered by real quarto. Fifteen seconds, and
      # it either reproduces the failure with the interpreter's own diagnosis or
      # proves the render will get past chapter 47.
      #
      # It also repairs a blind spot in the check it imitates:
      # `py_require_pandas()` discards stderr, so *any* failure to start the
      # interpreter reads as "this interpreter has no pandas". That is what made
      # the first two diagnoses wrong. This one prints what actually happened.
      # All three interpreters, not just Python. The Julia segfault cost a full
      # six-minute render to discover at chapter 48 and would have shown up here in
      # twenty seconds. A probe that covers one of three runtimes is a probe that
      # passes shortly before the render fails, which is the specific mistake this
      # step exists to stop repeating.
      - name: Prove the book's interpreters work, through quarto
        shell: bash
        run: |
          PROBE="$RUNNER_TEMP/probe"
          rm -rf "$PROBE"; mkdir -p "$PROBE"
          cat > "$PROBE/probe.qmd" <<'EOF'
          ---
          title: probe
          ---

          ```{r}
          # The diagnostics go to a **file**, which the surrounding shell step prints
          # afterwards. Two earlier versions of this probe reproduced the crash and
          # then lost the interpreter's own account of it: knitr buffers a chunk's
          # stdout and discards it when the chunk aborts, and it captures stderr into
          # the rendered document rather than the console — so neither `cat()` nor
          # `message()` reaches the log when the render dies. A file cannot be
          # swallowed by either mechanism.
          diag <- Sys.getenv("PROBE_DIAG")
          say <- function(...) cat(..., "\n", sep = "", file = diag, append = TRUE)

          run <- function(label, exe, args, want, fatal = TRUE) {
            say("\n## ", label, "\n   ", exe)
            out <- suppressWarnings(system2(exe, args, stdout = TRUE, stderr = TRUE))
            status <- attr(out, "status")
            if (is.null(status)) status <- 0
            say("   status: ", status)
            for (line in out) say("   | ", line)
            ok <- status == 0 && any(grepl(want, out, fixed = TRUE))
            say("   verdict: ", if (ok) "ok" else "FAILED")
            if (!ok && fatal) {
              stop(label, " does not work through quarto, so the render would fail ",
                   "in bindings/ for the same reason")
            }
            ok
          }

          for (v in c("GOG_BOOK_PYTHON", "GOG_BOOK_JULIA", "GOG_BOOK_NODE",
                      "PYTHONHOME", "PYTHONPATH", "VIRTUAL_ENV", "LD_LIBRARY_PATH",
                      "JULIA_DEPOT_PATH", "JULIA_LOAD_PATH", "JULIA_PROJECT")) {
            say(sprintf("%-18s %s", v, Sys.getenv(v, unset = "(unset)")))
          }

          run("python + pandas", Sys.getenv("GOG_BOOK_PYTHON"),
              c("-c", shQuote("import sys, pandas; print(sys.prefix); print('PROBE_OK', pandas.__version__)")),
              "PROBE_OK")

          # `--project` and `--startup-file=no` exactly as `jl_run()` invokes it, so
          # a Julia that starts but cannot load the package is caught here too. The
          # project path comes from the environment because this probe renders in a
          # temporary directory, where walking up from `getwd()` finds nothing.
          jl_project <- file.path(Sys.getenv("GOG_PROJECT_ROOT"), "jl-pkg",
                                  "GrammarOfGraphics")
          run("julia + GrammarOfGraphics", Sys.getenv("GOG_BOOK_JULIA"),
              c(paste0("--project=", shQuote(jl_project)),
                "--startup-file=no", "-e",
                shQuote("using GrammarOfGraphics; println(\"PROBE_OK\")")),
              "PROBE_OK")

          run("node", Sys.getenv("GOG_BOOK_NODE"),
              c("-e", shQuote("console.log('PROBE_OK', process.version)")),
              "PROBE_OK")

          # A refusal, through the whole preamble `jl_run()` uses. `bindings/julia.qmd`
          # renders three of these and the first one segfaulted on two different
          # Julia installs, while the same case — `@refuses x("gdp")` at
          # `runtests.jl:141` — passes in the Julia suite on this same runner. So the
          # difference is in how the book invokes Julia, not in Julia or the binding,
          # and reproducing it here turns a six-minute render into twenty seconds.
          script <- file.path(tempdir(), "refusal.jl")
          writeLines(c(
            "using GrammarOfGraphics",
            "using GrammarOfGraphics: bin, count, sum, min, max, range, size, step, stack",
            "gm = (gdp = [1000.0, 8000.0], life = [52.0, 68.0])",
            "try",
            "    render_svg(data(gm) + point + x(\"gdp\") + y(:life))",
            "    println(\"DREW\")",
            "catch error",
            "    error isa GogError || rethrow()",
            "    println(\"PROBE_OK refused\")",
            "end"
          ), script)
          jl_args <- c(paste0("--project=", shQuote(jl_project)),
                       "--startup-file=no", shQuote(script))

          # The raw interpreter first, and it is allowed to fail. This is not
          # ceremony: it records in the log *why* the wrapper exists, so nobody
          # later removes a one-line shim that looks like superstition. Expect
          # status 139 — SIGSEGV — from the inherited `LD_LIBRARY_PATH`.
          raw_ok <- run("julia refuses a string channel (raw, LD_LIBRARY_PATH inherited)",
                        Sys.getenv("GOG_BOOK_JULIA_RAW"), jl_args, "PROBE_OK",
                        fatal = FALSE)
          if (raw_ok) {
            say("\n   NOTE: the raw interpreter now works too. If that holds, the",
                "\n   LD_LIBRARY_PATH wrapper is no longer needed and can go.")
          }

          run("julia refuses a string channel (through the wrapper)",
              Sys.getenv("GOG_BOOK_JULIA"), jl_args, "PROBE_OK")
          ```
          EOF
          cd "$PROBE"
          RC=0
          GOG_PROJECT_ROOT="$GITHUB_WORKSPACE" PROBE_DIAG="$PROBE/diag.txt" \
            quarto render probe.qmd --to html || RC=$?
          echo "──────── what each interpreter answered ────────"
          cat "$PROBE/diag.txt" 2>/dev/null || echo "(the chunk wrote nothing)"
          echo "───────────────────────────────────────────────"
          exit "$RC"

      - name: Render the whole book to HTML
        working-directory: book
        shell: bash
        # `--to html` is what keeps the 816-page PDF off the free site: Quarto
        # links a download only for a format it finds rendered, and print is the
        # publisher's. `PIPESTATUS` because `tee` would otherwise mask the exit.
        #
        # The profile merges `_quarto-publish.yml` over the config, and the
        # footer's reader count is the whole of what that adds. It is kept out
        # of the base config because the badge is fetched by every browser that
        # opens a page, so a local preview would count itself as a reader.
        env:
          QUARTO_PROFILE: publish
        run: |
          set -o pipefail
          quarto render --to html 2>&1 | tee .render.log

      - name: Grade the render log
        working-directory: book
        shell: bash
        # The usual advice for reading a render by eye is the broad grep
        # `-inE "warn|error|unable|cannot|fail|not found"`. That is right for a
        # human and wrong as an automatic gate *on this book*, which is largely
        # about refusals: it has 138 `error: true` chunks, so those words appear
        # throughout ordinary healthy output.
        #
        # Quarto's own markers are what a gate can trust: `ERROR:` and `WARN:` at
        # the start of a line, and a stack trace when it dies.
        run: |
          if grep -nE "(^|\[[0-9;]*m)(ERROR|WARN):|^Stack trace:" .render.log; then
            echo "::error::the render log has complaints (above)"
            exit 1
          fi
          if grep -n "the language-tab translator failed" .render.log; then
            echo "::error::the translator failed - the book rendered R-only"
            exit 1
          fi
          echo "log is clean"

      - name: Check the rendered output
        working-directory: book
        shell: bash
        run: |
          test -f _book/index.html || { echo "::error::_book/index.html is missing"; exit 1; }

          # The placeholder repo-url once shipped "Edit this page" buttons
          # pointing at a repository that never existed.
          if grep -rq "your-org" _book/; then
            echo "::error::the placeholder repo-url 'your-org' is in the output"
            exit 1
          fi

          # A PDF in _book/ means Quarto offers the whole book as a download.
          if find _book -name '*.pdf' -print -quit | grep -q .; then
            echo "::error::a PDF is in _book/ - it would appear as a download link"
            exit 1
          fi

          grep -q "site_libs" _book/index.html \
            || { echo "::error::index.html does not reference site_libs"; exit 1; }

          # The turnable cube, checked in three places because it fails quietly
          # in all three. A reader loses the interactivity and the page still
          # looks finished, so nothing else in this job would notice.
          #
          # 1. Quarto copied the engine. `resources:` in `_quarto.yml` is what
          #    puts these beside the pages that fetch them, and a *single-file*
          #    render skips resources entirely — so this is the step that proves
          #    the project render did not.
          test -f _book/gog.wasm \
            || { echo "::error::_book/gog.wasm is missing - 3-D plots will not turn"; exit 1; }
          test -f _book/interactive.js \
            || { echo "::error::_book/interactive.js is missing - 3-D plots will not turn"; exit 1; }
          # Every plot needs this one, not only the cubes: it carries zoom, pan
          # and fit, and it is staged without the engine because it needs none.
          test -f _book/view.js \
            || { echo "::error::_book/view.js is missing - no plot can be zoomed"; exit 1; }

          # 2. The chapters actually asked for it. If `R/setup.R` could not find
          #    the engine it reports the absence and renders static cubes, which
          #    is right for a checkout and wrong for a publish.
          grep -q 'mount("gog-' _book/space.html \
            || { echo "::error::space.html has no interactive plots - the engine was not found at render time"; exit 1; }

          # 3. And asked by URL, not by carrying the engine inline. Left unset,
          #    the bindings inline it as base64 — correct for a notebook, and
          #    about 1.1 MB added to every page here.
          if grep -q "data:application/wasm" _book/space.html; then
            echo "::error::the engine is inlined per plot - set gog.wasm_url so one cached copy serves the book"
            exit 1
          fi

          # Required: Pages runs Jekyll, which strips underscore-prefixed paths.
          touch _book/.nojekyll
          cp LICENSE.md _book/LICENSE.md

          echo "output looks right ($(du -sh _book | cut -f1))"

      # Cross-repo, so the site keeps being served from `psychometrician/gog-book`
      # and this repository keeps its own Pages slot free. A deploy key rather than
      # a token: it grants write on exactly one repository and nothing else.
      #
      # `force_orphan` keeps the site at one commit with no parent. History of
      # generated output answers no question a reader has, and it is what pins the
      # repository at ~25 MB — every engine change rewrites every inlined SVG, so
      # an accumulating history would add a near-complete copy of the site per
      # publish.
      - name: Publish to the site repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.BOOK_SITE_DEPLOY_KEY }}
          external_repository: psychometrician/gog-book
          publish_branch: main
          publish_dir: book/_book
          force_orphan: true
          # No `${{ github.sha }}` here: the action appends `<owner>/<repo>@<sha>`
          # of its own accord, and naming it as well put the same 40 characters in
          # twice. The suffix is the provenance, and it is worth having now that the
          # source repository is one a reader can open — which is exactly why
          # `publish.sh` had to strip it while that repository was private.
          commit_message: "GOG: A Grammar of Graphics — rendered from"
