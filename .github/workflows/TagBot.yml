# Tag the Julia releases that the General registry has accepted.
#
# Registrator registers a *tree hash*, not a tag, so a merged registration leaves
# nothing in this repository marking which commit became `GrammarOfGraphics`
# v0.0.1. TagBot closes that: when the registry PR merges, it creates the git tag
# and the GitHub release here to match.
#
# `subdir` is required and is the whole reason this file needs care. The package
# is one of four bindings in a monorepo, so its version lives in
# `jl-pkg/GrammarOfGraphics/Project.toml` rather than at the root, and TagBot has
# to be told where to read it. Without this it would look for a root
# `Project.toml`, find none, and do nothing.
#
# Because `subdir` is set, the tags it writes carry the package name:
# `GrammarOfGraphics-v0.0.1`, not a bare `v0.0.1`. That matches neither `py-v*`
# nor `js-v*` — the two tag patterns that trigger a publish — so a Julia tag
# cannot set off a Python or npm release.
#
# **`ssh:` is why this works at all, and it is not optional here.** With only
# `token:`, TagBot pushes as `GITHUB_TOKEN`, which acts as a GitHub App — and
# GitHub refuses any ref push from an App that would create or update a file
# under `.github/workflows/`. A registration points at the commit Registrator
# was run on, so the moment a later commit edits any workflow file, pushing the
# tag for that older commit reads as a workflow change and is rejected. That is
# not a rare corner: this file is itself a workflow, so editing it guarantees
# the failure for the next registration. Every attempt at `GrammarOfGraphics-v0.0.1`
# was rejected exactly this way, which is why the repository had no tags at all.
#
# There is no fix inside `permissions:` — `workflows` is a personal-token scope,
# not one of the fourteen keys a workflow can request. A deploy key is not an App
# and is not subject to the rule, so `DOCUMENTER_KEY` holds one with write access
# and TagBot pushes over SSH instead. The name is TagBot's own convention rather
# than anything to do with Documenter.
#
# Nothing about installing the package depends on the tag either way: Pkg
# resolves a version by tree hash, so `Pkg.add` works whether or not it exists.
# The tag is provenance, and a release page.

name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    # The `issue_comment` trigger fires on every comment in the repository. This
    # is the guard that makes it act only on the registry bot's own report.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: jl-pkg/GrammarOfGraphics
