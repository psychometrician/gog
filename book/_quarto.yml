project:
  type: book

  # Stages the browser engine into `book/` before anything is rendered. It has to
  # run here rather than in `R/setup.R`: Quarto decides what `resources:` means
  # at the *start* of a render, and `setup.R` runs once per chapter, well after
  # that decision. A copy made there arrives too late to be published, which
  # looks correct on a machine that rendered before and fails on a clean one.
  pre-render:
    - R/copy-assets.R
    # Compares the vocabulary the highlighter paints, and the vocabulary the PDF
    # filter paints, against the kernel this book declares in `grammar.qmd`. A
    # new mark that reached the chapter and not the highlighter would render as
    # though it were a column name, and nothing else would fail: the page is
    # correct, the plot draws, the build exits 0. So the render stops instead.
    - R/check-kernel.R

  # The book's example tables, as CSV. Quarto copies these into `_book/`, and
  # `publish.sh` rsyncs all of `_book/` to the site, so each frame ends up at a
  # stable public URL under `psychometrician.github.io/gog-book/data/`. That URL
  # is what makes the manual reproducible for a reader in any of the four
  # languages — spec §20, "The cast is fetched, not shipped".
  #
  # Declared rather than left to Quarto's own resource discovery, because the
  # book renders offline from these same files by relative path and a chapter
  # that only *reads* one does not make it a discovered dependency.
  resources:
    - data/
    # The browser engine, and the module that drives it. A plot in the cube is
    # turnable wherever the page can run these, and *one* copy serves every 3-D
    # plot in the book because they are fetched by URL and cached. The
    # alternative the bindings default to is carrying the engine inside each
    # plot as base64, which is right for a notebook that must survive being
    # emailed and wrong here — it would add about 1.1 MB to every page with a
    # cube on it. `R/setup.R` points the bindings at these and copies them in.
    #
    # PDF is unaffected without needing to be excluded: the LaTeX path returns
    # before the HTML wrapper is ever built, so a printed cube is the still
    # image it always was.
    - gog.wasm
    - interactive.js
    # The view module: zoom, pan and fit for every plot. Listed beside the
    # other two and staged without them, because it asks the engine nothing.
    - view.js

book:
  title: "gog: A Grammar of Graphics"
  subtitle: "One engine. Every language."

  # The hex sticker, designed by the author. It is the cover, not a placeholder
  # for one, and no sticker package or model made it. Quarto puts it straight
  # after the landing page's first heading, and the preface's *agog* section
  # explains what the four symbols in it are; `gog.css` gives it a size, since
  # the file declares a width of its own and `img-fluid` alone would let that
  # run to the column edge.
  #
  # Raster rather than vector, and the reason is the one part of the sticker
  # that is not drawn geometry. The name across the bottom is set in Avenir
  # Next, which ships on macOS and essentially nowhere else, so a vector copy
  # asks each reader's browser for a font most of them do not have and draws
  # the `g` in whatever it finds instead. Rendering it once settles the
  # letterform for everybody, which is what a wordmark is for.
  cover-image: images/gog-hex.png
  cover-image-alt: >-
    The gog hex sticker. A peach hexagon with a black border, holding a face
    built from the package's four operators: a plus and an asterisk as its two
    eyes, a slash and a vertical bar as its nose, and the package name as its
    mouth.
  # Five names, and the division of labor behind them is stated in the
  # preface ("Who wrote this") rather than left to a reader to guess. The
  # four models wrote the engine, the four bindings and the test suites, and
  # put the text into English; the thinking the text expresses is the human's,
  # the way a ghostwritten autobiography is its subject's. The copyright
  # holder and sole package author is the human, because a model cannot hold
  # one.
  author:
    - "psychometrician"
    - "Claude Sonnet 4.6"
    - "Claude Opus 4.8"
    - "Claude Opus 5"
    - "Claude Fable 5"
  # Two dates, and only one of them moves. `date` is the day the book first went
  # up as a public website, written out in full so no render can change it. Its
  # partner `date-modified` re-stamps on every build, and lives in `index.qmd`'s
  # front matter rather than here: `book:` rejects the key outright, and setting
  # it at this file's top level instead would stamp an "Updated" row onto all
  # 55 chapter pages, when only the landing page is a record of anything. Both
  # labels are renamed under `language:` below.
  date: "2026-07-28"

  # The site is served from a repository holding only the *rendered* book, so
  # "edit this page" has no source file to open and is left off. An issue link
  # still works, and is how a reader reports a typo. `site-url` is not needed to
  # serve the book; it is what gives the pages canonical URLs and a sitemap.
  repo-url: https://github.com/psychometrician/gog-book
  repo-actions: [issue]
  site-url: https://psychometrician.github.io/gog-book/

  # Two licenses, because the book is mostly executable code. The prose is
  # NonCommercial so a print edition stays worth publishing; the code samples
  # are Apache 2.0 so they can be used in real work.
  # The site's footer, said again here, because the book and the blog are one
  # project and a reader should not be able to tell which one they are standing
  # in. `gog.css` holds how it looks; this is what is in it.
  #
  # Licences on the left, as the small print they are. The row of links on the
  # right, because that is what a reader who has reached the end of a chapter is
  # looking for. The reader count between them, where it is legible and asks for
  # nothing.
  page-footer:
    left: |
      [Prose licensed [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/).]{.licence}
      [Code samples licensed [Apache 2.0](https://www.apache.org/licenses/LICENSE-2.0).]{.licence}
    # The footer's center holds a reader count on the published site, and only
    # there. It is a hits.sh badge, and the badge is fetched by every browser
    # that opens a page, `localhost` among them, so left in this file it would
    # count each chapter previewed while writing as a reader. It lives in
    # `_quarto-publish.yml` instead, which the site's build merges over this one
    # and a local render never loads. That file says the rest.
    right:
      # The same three the site follows with, in the same order, drawn from
      # Bootstrap Icons in `currentColor` so they take the theme with no second
      # copy and no swap rule.
      - icon: twitter-x
        href: https://x.com/gogdeveloper
        aria-label: "gog on X"
        target: _blank
      - icon: bluesky
        href: https://bsky.app/profile/gogdeveloper.bsky.social
        aria-label: "gog on Bluesky"
        target: _blank
      # The profile rather than the repository, matching the site. A reader who
      # wants the source has "Report an issue" in the margin of every page.
      - icon: github
        href: https://github.com/psychometrician
        aria-label: "psychometrician on GitHub"
        target: _blank
      # The site, and the one place the book's footer differs from it. The site
      # ends its row with RSS, subscribing you to itself; this book has no feed,
      # and an RSS mark here would promise one. It would also be the fifth mark
      # in a row of four destinations, where a reader has to work out that one of
      # them does something else. So the row ends at the site, and a reader who
      # wants the feed finds it there.
      #
      # Until now the link ran one way: the site's navbar has pointed at this
      # book since it was built, and the book gave a reader no route back.
      #
      # `journal-text` rather than the `list-ul` the site uses for its own posts
      # page. That mark is site navigation, naming an index; this one names the
      # site from outside it, and among X, Bluesky and GitHub a bulleted list
      # reads as a control rather than as a destination. It is also deliberately
      # not `book`, which is what the site uses for *this*, so the two marks
      # cannot be mistaken for each other by a reader who sees both.
      - icon: journal-text
        href: https://psychometrician.github.io/
        aria-label: "psychometrician, the blog"
        target: _blank

  # A toggle in the top right that folds away the chapter sidebar and the table
  # of contents, leaving the prose and the plots the whole width. It is off
  # until the reader asks for it, and the browser remembers the choice across
  # pages. The plots are what make it worth having: the engine draws every SVG
  # at a fixed 800px, which is wider than the reading column on most screens,
  # so a dense figure — a faceted grid, a cube, the Mark × Channel table — is
  # the first thing to benefit from the two columns going away.
  reader-mode: true

  # The shape borrows from the Hunminjeongeum (1446): the system stated
  # fast, then each letter class, then assembly, then words in use, then
  # the reasons. Part titles stay plain English — the correspondence is
  # told in each part's introduction, never used as navigation.
  chapters:
    - index.qmd

    - part: parts/morning.qmd            # the whole grammar, one sitting
      chapters:
        - first-plot.qmd
        - grammar.qmd                    # the kernel block lives here — check_vocabulary.R reads it
        - reading.qmd
        - writing.qmd

    - part: parts/letters.qmd            # each atom family in depth
      chapters:
        - data.qmd
        - book-data.qmd                  # the shared tables, and their public CSVs
        - marks/index.qmd
        - marks/point.qmd
        - marks/line.qmd
        - marks/bar.qmd
        - marks/area.qmd
        - marks/step.qmd
        - marks/interval.qmd
        - marks/box.qmd
        - marks/ribbon.qmd
        - marks/text.qmd
        - marks/path.qmd
        - marks/rule.qmd
        - marks/zone.qmd
        - marks/surface.qmd
        - marks/edge.qmd
        # `scales` is a vowel rather than a refinement — it decides where a
        # position lands — so it comes before the finals, which is the order
        # `parts/letters.qmd` states
        - scales.qmd
        - channels.qmd
        - style.qmd
        - transforms.qmd

    - part: parts/sentences.qmd          # composition: layer, derive, scope, facet, 3-D
      chapters:
        - operators.qmd
        - encoding-scope.qmd
        - faceting.qmd
        - composition.qmd
        - flow.qmd
        - space.qmd
        - polar.qmd
        - nest.qmd
        # the five coordinate spaces stay contiguous. `map` and `globe` belong
        # beside their siblings, not after the two chapters that are not spaces
        # at all — and `globe` follows `map` because it reads with both halves
        # in hand: the map's data and the cube's view.
        - map.qmd
        - globe.qmd
        - network.qmd
        - play.qmd
        - selection.qmd

    - part: parts/cookbook.qmd           # recipes by data shape and question
      chapters:
        - cookbook/one-variable.qmd
        - cookbook/two-variables.qmd
        - cookbook/three-or-more.qmd
        - cookbook/over-time.qmd
        - cookbook/groups.qmd
        # composition is a *sentence*, not a recipe: it is in composition.qmd,
        # beside faceting, because the two are one pair of operators

    - part: parts/reasons.qmd            # the nine laws, and why the engine says no
      chapters:
        - design-laws.qmd

    - part: parts/bindings.qmd           # what belongs to the host language, not the grammar
      chapters:
        - bindings/r.qmd
        - bindings/python.qmd
        - bindings/julia.qmd
        - bindings/javascript.qmd

    - afterword.qmd
    - references.qmd

  appendices:
    - kernel-card.qmd
    - utilities.qmd
    - combinations.qmd
    - chart-names.qmd
    - phrasebook.qmd
    - coverage.qmd

bibliography: references.bib

# APA 7th, because this book's field uses it. The preface names the author as a
# psychometrician and cites *Educational Measurement: Issues and Practice*, and
# APA is the house style across psychology and educational measurement. Without
# this key pandoc falls back to Chicago author-date, which is a fine style and
# simply not the one a reader here expects.
#
# The file is committed rather than fetched. Quarto ships no CSL styles at all,
# so a build machine without this file beside `_quarto.yml` would silently get
# Chicago back, and a citation style that changes depending on who ran the
# render is the same class of problem as a plot that changes with the machine.
# It is the Zotero distribution of the official style, "APA Style 7th edition",
# and it stays a quoted external file: the American English rule governs prose
# this book writes, never text it carries.
csl: apa.csl

# Quarto's default labels for the two dates above are "Published" and
# "Modified". Both are renamed rather than accepted: "Published" alone read as
# one date when there are two, and "Modified" describes a file where the reader
# wants to know how current the book is.
language:
  title-block-published: "First published"
  title-block-modified: "Updated"

format:
  html:
    # Two themes and a toggle. Declaring both is what makes Quarto write the
    # switch and put `quarto-light` / `quarto-dark` on the body, which is what
    # `gog.css` keys its dark rules off.
    #
    # The two files are the book's and the blog stages them, the same direction
    # `gog.css` already travels. One palette, one home: the book and the site
    # are one project, and a second copy of a color is how they would drift into
    # looking like two.
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    # One rule, and it is about the diagnostics. `gog:` messages are written as
    # *paragraphs on one line* — the engine has no idea how wide a page is, and
    # baking a column count into a message would be the wrong layer deciding.
    # Chunk output is a `<pre>`, which scrolls sideways by default, so a long
    # refusal ran off the edge and a reader saw the half that fitted.
    # `code-overflow: wrap` does not reach these: it styles *source* blocks only.
    css: gog.css
    # Sets every package name in code font, in prose, from a list of names rather
    # than from 350 pairs of backticks a writer would have to remember. Listed
    # under both formats on purpose: a format's `filters:` replaces the value
    # above it rather than adding to it, so the PDF names it again beside the
    # syntax filter instead of inheriting it.
    filters:
      - package-names.lua
    # Colors a gog specification by kind, which nothing ships a rule for. It runs
    # in the browser rather than at render time so that it adds to Pandoc's
    # tokens instead of replacing them, which is what keeps the panel, the copy
    # button and the line anchors Quarto builds around a block. The PDF cannot
    # run it, so `filters:` below does the same job in LaTeX.
    include-after-body: gog-syntax.html
    code-copy: true
    toc: true
    toc-depth: 3
    number-sections: true

  # PDF, enabled 2026-07-26. It had been off since the book began, for a reason
  # that was true when written: `knit_print.gog_spec` short-circuited on LaTeX and
  # emitted "(plot not shown in PDF output)", so a PDF was text-only. That is
  # fixed — it now writes each plot's SVG out and converts it with
  # `rsvg-convert -f pdf`, vector in and vector out, so a figure on the page keeps
  # the resolution the SVG had.
  #
  # Two build requirements, neither of them optional:
  #
  #   * **lualatex**, for the Hangeul fallback below.
  #   * **rsvg-convert** on `PATH` (or `$RSVG_CONVERT_PATH`). Without it every
  #     plot becomes a named box rather than vanishing, so a build that lacks it
  #     says so on the page instead of shipping 600 blank pages.
  #   * the TeX Live packages **fvextra** and **baekmuk**
  #     (`tlmgr install fvextra baekmuk`).
  pdf:
    documentclass: scrreprt
    number-sections: true
    pdf-engine: lualatex
    # The PDF's half of the color rule. The HTML edition colors a specification
    # in the browser, which keeps Quarto's panel and copy button intact; a PDF
    # has neither, so the filter rewrites the block outright. It reads the
    # vocabulary out of `grammar.qmd`, so the printed colors derive from the
    # chapter that declares the kernel rather than from a second copy of it.
    filters:
      - gog-syntax.lua
      - package-names.lua
    include-in-header:
      text: |
        % Long lines wrap instead of running off the page. Both environments are
        % needed and neither is Quarto's `code-overflow: wrap`, which reaches the
        % *source* blocks only: `Highlighting` is the code a chunk shows and
        % `verbatim` is what the chunk printed, and a `gog:` diagnostic is the
        % second one. Unwrapped, LaTeX's own answer to an over-wide verbatim line
        % is to let it run past the margin and be clipped, so the reader lost the
        % half of the message that says what to do about it.
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,breakanywhere,commandchars=\\\{\}}
        \DefineVerbatimEnvironment{verbatim}{Verbatim}{breaklines,breakanywhere}
        % Hangeul, and this is not cosmetic: the book's central analogy *is* the
        % letters. Latin Modern has no Korean coverage, so ㄱ, ㅋ, 하 and 꿲 came out
        % as replacement glyphs — the 하 law and the 꿲 law printed with their
        % subjects missing, in a 600-page PDF that exited 0 and warned about
        % nothing. A fallback keeps Latin in Latin Modern and sends anything it
        % cannot draw to a Korean face.
        %
        % `batang.ttf` is TeX Live's own (the `baekmuk` package) and is named by
        % file rather than by family on purpose: it resolves on any TeX Live
        % without a system font install, where "Apple SD Gothic Neo" — which also
        % works, and was what proved the fallback — would make the book buildable
        % on one operating system.
        \directlua{luaotfload.add_fallback("goghangeul", { "batang.ttf:mode=harf;" })}
        \setmainfont{Latin Modern Roman}[RawFeature={fallback=goghangeul}]
        \setsansfont{Latin Modern Sans}[RawFeature={fallback=goghangeul}]
        \setmonofont{Latin Modern Mono}[RawFeature={fallback=goghangeul}]
        % The colors a specification is printed in, matching the web edition's
        % light theme exactly so that the two editions of one book agree.
        % `gog-syntax.lua` emits these commands; `gog.css` says the same thing in
        % the other format, and `grammar.qmd` states the rule for the reader.
        \definecolor{goginktable}{HTML}{1A6B54}
        \definecolor{goginkmark}{HTML}{B04A10}
        \definecolor{goginkchannel}{HTML}{2B5FA8}
        \definecolor{goginktransform}{HTML}{7A3F9C}
        \definecolor{goginkrefine}{HTML}{6E655C}
        \definecolor{goginkbody}{HTML}{1D1A16}
        \newcommand{\gogTable}[1]{\textcolor{goginktable}{#1}}
        \newcommand{\gogMark}[1]{\textcolor{goginkmark}{#1}}
        \newcommand{\gogChannel}[1]{\textcolor{goginkchannel}{#1}}
        \newcommand{\gogTransform}[1]{\textcolor{goginktransform}{#1}}
        \newcommand{\gogRefine}[1]{\textcolor{goginkrefine}{#1}}
        % The operator takes weight rather than a color. In three of the four
        % languages it is punctuation and already reads as itself, so a sixth ink
        % would make JavaScript the loud one instead of the matching one.
        \newcommand{\gogOperator}[1]{\textcolor{goginkbody}{\textbf{#1}}}
        % Every other token takes the body's ink, which is the base the accents
        % go on top of. Pandoc paints by host language, and the four disagree
        % about the same specification: R calls `data` a function, Python marks
        % nothing at all, and neither can see `point`. Left alone, one book would
        % print one specification four different ways.
        %
        % Renewed rather than switched off. `highlight-style: none` also removes
        % the `Shaded` environment these blocks sit in.
        \newcommand{\gogPlainTok}[1]{\textcolor{goginkbody}{#1}}
        \renewcommand{\AlertTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\AnnotationTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\AttributeTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\BaseNTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\BuiltInTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\CharTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\CommentTok}[1]{\textcolor{goginkrefine}{\textit{#1}}}
        \renewcommand{\CommentVarTok}[1]{\textcolor{goginkrefine}{\textit{#1}}}
        \renewcommand{\ConstantTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\ControlFlowTok}[1]{\textcolor{goginkbody}{\textbf{#1}}}
        \renewcommand{\DataTypeTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\DecValTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\DocumentationTok}[1]{\textcolor{goginkrefine}{\textit{#1}}}
        \renewcommand{\ErrorTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\ExtensionTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\FloatTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\FunctionTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\ImportTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\InformationTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\KeywordTok}[1]{\textcolor{goginkbody}{\textbf{#1}}}
        \renewcommand{\NormalTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\OperatorTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\OtherTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\PreprocessorTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\RegionMarkerTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\SpecialCharTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\SpecialStringTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\StringTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\VariableTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\VerbatimStringTok}[1]{\gogPlainTok{#1}}
        \renewcommand{\WarningTok}[1]{\textcolor{goginkrefine}{\textit{#1}}}

execute:
  echo: true
  warning: false
  message: false
