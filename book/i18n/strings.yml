# The words the book's helpers (book/R/setup.R) print around a table, one block
# per language. A key with no entry prints its English. Each English original is
# beside its key below; `%s` and `%d` stay as they are, in the same order.
#
#   peek_one          "`%s`: its one row"
#   peek_all          "`%s`: all %d rows"
#   peek_first        "`%s`: first %d of %d rows"
#   settings_setting  "Setting"          (the settings table's header)
#   settings_value    "Value"
#   corner_mark       "Mark"             (a glyph grid's corner)
#   corner_setting    "Setting"
#   value_caps        "true or false"
#   value_center      "true or false"
#   value_color       "any CSS color name or hex"
#   value_border_color "any CSS color name or hex"
#   value_opacity     "0 to 1"
#   value_size        "pixels"
#   value_border_size "pixels"
#   value_angle       "degrees, counterclockwise from horizontal"
#   value_gap         "a share of the mark's place, from 0 to just under 1"
#   families_family   "Family"           (the mark families table in marks/index)
#   families_same     "Same rules for every channel"
#   families_differ   "They differ in"
#   families_and      " and "            (between two mark names, outside the backticks)
#   differs_line_step     "`line` **slopes** from one value to the next; `step` **holds** each value until it changes"
#   differs_area_ribbon   "`area` closes its region on the **baseline**; `ribbon` closes it on a **second data boundary**"
#   differs_box_interval  "`box` computes its **own summary** of each group; `interval` spans **two ends a transform supplies**"
#   differs_missing   "**(no description yet for this family)**"
#   transforms_kind   "Kind"             (the "Transforms it takes" table in each mark chapter)
#   transforms_takes  "Takes"
#   transforms_refuses "Refuses"
#   kind_counting     "Counting"
#   kind_summary      "Summaries"
#   kind_fitted       "Fitted lines"
#   kind_running      "Running total"
#   kind_pair         "Pairs: a low and a high"
#   kind_collision    "Collision modifiers"
#   kind_layout       "Layouts of a whole picture"

ko:
  peek_one: "`%s`: 행 하나"
  peek_all: "`%s`: 행 %d개 모두"
  peek_first: "`%s`: 처음 %d개 행(전체 %d개)"
  settings_setting: "설정"
  settings_value: "값"
  corner_mark: "마크"
  corner_setting: "설정"
  value_caps: "true 또는 false"
  value_center: "true 또는 false"
  value_color: "CSS 색 이름이나 hex 코드"
  value_border_color: "CSS 색 이름이나 hex 코드"
  value_opacity: "0에서 1까지"
  value_size: "픽셀"
  value_border_size: "픽셀"
  value_angle: "각도(도), 가로 방향에서 시계 반대 방향으로"
  value_gap: "마크 자리에 대한 비율, 0 이상 1 미만"
  families_family: "마크 패밀리"
  families_same: "모든 채널에서 같은 규칙"
  families_differ: "다른 점"
  families_and: ", "
  differs_line_step: "`line`은 한 값에서 다음 값으로 **비스듬히** 이어지고, `step`은 값이 바뀔 때까지 각 값을 **그대로 유지**합니다"
  differs_area_ribbon: "`area`는 영역을 **기준선**까지 칠하고, `ribbon`은 데이터로 정한 **두 번째 경계**까지 칠합니다"
  differs_box_interval: "`box`는 집단마다 **요약을 직접 계산**하고, `interval`은 **변환이 정해 준 두 끝** 사이를 잇습니다"
  differs_missing: "**(이 패밀리의 설명이 아직 없습니다)**"
  transforms_kind: "종류"
  transforms_takes: "쓸 수 있는 변환"
  transforms_refuses: "거부하는 변환"
  kind_counting: "세는 변환"
  kind_summary: "요약 변환"
  kind_fitted: "적합선"
  kind_running: "누적 합계"
  kind_pair: "짝 변환: 낮은 값과 높은 값"
  kind_collision: "겹침 조정"
  kind_layout: "배치 변환"
