  - {en: "pattern (the texture setting) / stroke pattern / fill texture / hatch / dash", ko: "pattern / 선에 쓰는 값 / 면에 쓰는 값 / 빗금 / 점선", status: ruled, avoid: [무늬, 점선 무늬], note: "the author, 2026-10-30: 'should we say pattern instead of 무늬?' and 'dash is one of options of pattern'. pattern is the setting and channel the reader types, kept in English like whisker and cap, read 패턴 (pattern은/을/이/으로); in code font where the English has code, plain where the English writes the plain word or 'texture' (bar's ## pattern {#texture}). Its values differ by geometry: on a stroke solid/dashed/dotted/dotdash/longdash, on a fill hatch/crosshatch/stripes/grid/dots. 점선(dash) is a dashed look, one of those values, never the name of the setting: write 점선을 쓴 문장 for a dashed sentence, but pattern이 정해집니다 for the setting. 빗금 is the look of the `hatch` value, one of a fill's values, never the name for all of them (the author, 2026-10-31, on ribbon's 'pattern은 빗금(hatch)이 되며': 'pattern is argument name is hatch is one of argument values'): never write that pattern becomes 점선 or 빗금; name the values (선에 쓰는 `pattern` 값은 …, 칠한 부분에 쓰는 값은 …), and never call `grid` or `dots` 빗금. A list of a stroke's values that includes solid is 선에 쓰는 값, never 점선 종류. The English names the two groups stroke pattern and fill texture, the words the engine's refusals print (sweep of 2026-10-31, after the hatch ruling); Korean writes 선에 쓰는 (pattern) 값 and 면에 쓰는 (pattern) 값, 칠한 부분에 쓰는 값 where the English says a filled region; texture alone, the general word, is pattern. 무늬 went from all 13 chapters (87 uses) the same day"}
