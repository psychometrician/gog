  - {en: "a mark named in prose", ko: "the everyday word with the mark in parentheses, as in the titles: 막대(bar), 점(point), 선(line), 영역(area), 계단(step), 상자(box), 글자(text); marks with no settled word are already written by name in code (`interval`, `ribbon`, `path`, `rule`, `zone`, `surface`, `edge`)", status: ruled, note: "the author, 2026-10-25: \"when prose refer to marks we should use english in parenthesis because the gog syntax is using bar instead of 막대\". Only where the word names the mark, the word you write in a sentence (막대(bar)에 `bin`을 쓰면, 막대(bar)는 0에서 시작합니다); a drawn shape on the page stays plain (두 막대가 맞닿고, 가장 긴 막대). The first such mention in each paragraph, table or list takes the parentheses; later ones in the same paragraph stay plain. Plain text, not code font, as in the titles. The particle follows the Korean word (막대(bar)를). Read-aloud sentences already use the English mark name and do not change. Settled in the first sweep (2026-10-25): the code word earlier in the same sentence counts as the mention (`point` 바로 뒤에 썼으므로 색은 점에만); a statement true of every plot with the mark takes the parentheses, the bars of the plot shown stay plain (막대마다 …); 선 for a stroke and 점 for a dot or a hatch dot stay plain; 오차 막대 is the interval's shape; a term with its own gloss (쌓은 막대(stacked bar)) gets no second one; never write 글자(text) for a text column or stored type (plain 글자), since (text) now means the mark"}
