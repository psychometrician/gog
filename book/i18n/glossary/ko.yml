# The Korean edition's glossary: one entry per term, edited by hand.
#
# The author's choice is final. Each entry is the English, the Korean the
# edition writes, and an optional note. `avoid:` lists words the edition must
# not write for it (an old choice, a rejected one); the translation check
# flags any chapter that still does.
#
# Three tiers:
#   keep   never translated, written in code font (every word of the grammar,
#          function and argument names, table and column names). `reading` is
#          how the word is said in Korean, which decides the particle after it:
#          `point`를, `bin`을, `x`는.
#   names  proper names kept in English, plain text.
#   gloss  translated by this file. The first use in each chapter adds the
#          English in parentheses: 히스토그램(histogram).
#
# Seeded 2026-10-17 from the two draft chapters (index, first-plot). Every
# entry marked `status: draft` is the translator's choice, not yet the
# author's; the review changes `draft` to `ruled` or edits the entry.
#
# `never:` (at the end) lists phrases the edition never writes, in any sense,
# each a ruling of the author's. The translation check fails a chapter that
# uses one, naming the line and the word to write instead, so a ruling is
# enforced and not only remembered. Keep each entry on one line, as
# {pattern: "<regular expression>", write: "<what to write>", why: "<ruling>"},
# with no backslashes in the pattern. An entry's `avoid:` list is different:
# those words are wrong in one sense only (표 for a data table, not for a printed
# one), so the editor judges them and no check does.

register: 합니다체        # the author, 2026-10-17: like a Korean textbook
questions: "~까요?"      # the author, 2026-10-17: a textbook's question (살까요?), not the strict ~니까?
yes_no: none             # the author, 2026-10-17: never an English "Yes," or "No," opening an answer
first_use: "한국어(English)"   # ruled by the author, 2026-10-17: Korean first, at the first use in each chapter

keep:
  # Every kernel word is in this tier, read from grammar.qmd's kernel table by
  # the check; only the readings that decide a particle are listed here.
  # The reading is the word as a Korean speaker says it aloud, not its English
  # final sound and not the official loanword spelling (the author, 2026-10-27,
  # on `color(continent)`로): 컨티넌트로 though "continent" ends in /t/, and
  # 쉐입을 though the official spelling 셰이프 would give 를.
  - {en: point, reading: 포인트}
  - {en: shape, reading: 쉐입}
  - {en: stack, reading: 스택}
  - {en: group, reading: 그룹}
  - {en: count, reading: 카운트}
  - {en: text, reading: 텍스트}
  - {en: continent, reading: 컨티넌트, note: "a column of the book's tables, listed for its particle: `color(continent)`로"}
  - {en: bar, reading: 바}
  - {en: bin, reading: 빈}
  - {en: line, reading: 라인}
  - {en: x, reading: 엑스}
  - {en: "y", reading: 와이}
  - {en: z, reading: 지}
  - {en: color, reading: 컬러}
  - {en: gog_table(), reading: 지오지 테이블}
  - {en: title(), reading: 타이틀}

  # Data values stay exactly as the data and the plots show them, in prose too:
  # continents (Africa, Oceania), species (setosa), countries (USA, China), so a
  # reader can match the prose to the picture (the author, 2026-10-18).
  - {en: "data values (continent, species, country names)", keep_as: "as in the data and on the plot", status: ruled}
  # Column names: as they are, or in Korean with the column name in parentheses
  # wherever the prose names the column: 꽃잎 길이(petal_length), 기대수명(life)
  # (the author, 2026-10-19).
  - {en: "column names", keep_as: "as they are, or Korean followed by (column_name)", status: ruled}

plot_names:
  # the author, 2026-10-17: "we don't need to translate plot types or plot terms
  # (rule, zone, etc) … because most of countries, people use english plot names."
  # Written in English, plain text, with the particle by the Korean reading:
  # histogram을, box plot의, wind rose가, sunburst는, hinge는.
  # Second reason, the author: "it is also much clear. if we translated them into
  # other language, it is not consistent. even among korean, there are multiple
  # terms to call histogram" (히스토그램, 도수분포도, 기둥그래프 …). One English
  # name is one name in every edition.
  rule: keep English
  examples: [histogram, box plot, pie chart, wind rose, sunburst, mosaic plot,
             flow diagram, network diagram, arc diagram, chord diagram,
             conditional plot, reference line, band, whisker, hinge]
  still_translated: [축, 눈금, 범례, 사분위수, 중앙값]   # statistics' own words, every Korean textbook's

names: [gog, GOG, agog, R, Python, Julia, JavaScript, TypeScript, Rust, Quarto,
        JupyterLab, Jupyter, Positron, RStudio, SVG, PNG, GIF, PDF, JSON,
        WebAssembly, ggplot2, lattice, CRAN, PyPI, npm, GitHub, Zenodo,
        r-universe, tidyverse, Canva, React, Supabase, YouTube, Wiley, NCME,
        Wilkinson, Wickham, Tukey, Gosset, Fisher,
        benevolent dictator for life]   # the author, 2026-10-17: kept in English; its three words are glossed where the preface explains them

gloss:
  # The book's own concepts.
  - {en: specification, ko: 설계도, status: ruled, avoid: [명세, 스펙, 사양], note: "the author, 2026-10-17, reversing the earlier 명세 ruling: no Korean reader uses 명세 (a contract's or an engineering document's word). 설계도 says what the result should be and leaves the building to the builder, which is the declarative idea. First use 설계도(specification). The verb is 쓰다 or 적다, never 그리다, which is the engine's. The code itself is the 문장; the specification is what that sentence is. Use 설계도 only where the declarative idea itself is meant; where the English says specification but means the code you write or print, the word is 문장 (the author, 2026-10-18, and the English now says sentence there). 'A plot is a specification' is said the author's way: gog에서 그래프를 그리는 것은 설계도를 만드는 것입니다 (2026-10-18), not 그래프는 설계도입니다. The author's reasoning: 명세 is the dictionary's translation, but not a word people use every day (명세서 is common, and means something else); 설계도 is not a translation of specification, but it is closer to what the word means in this book"}
  - {en: declarative, ko: 선언형, status: ruled, avoid: [선언적], note: "the author, 2026-10-17: gog is declarative; say the concept outright, set against 명령형(imperative). A specification states what to draw (무엇을 그릴지만 밝히고) and the engine decides how; never wording that suggests step-by-step instructions (다 써서). 선언형/명령형 are the Korean CS terms (선언형 프로그래밍)"}
  - {en: imperative, ko: 명령형, status: ruled, note: "drawing commands given one by one: 그리기 명령을 하나하나 내립니다"}
  - {en: live (a plot, a chunk), ko: 페이지를 만들 때 엔진이 직접 그리는, status: draft, avoid: [실시간], note: "the author, 2026-10-17, found 실시간으로 실행해 too literal: 실시간 is real time, a stream. The rule 'Every plot is live' is 그래프는 모두 엔진이 직접 그립니다"}
  - {en: screenshot, ko: 화면을 캡처해 붙인 그림, status: draft, avoid: [스크린숏], note: "the author asked for another word, 2026-10-17"}
  - {en: static image, ko: 그림 파일을 그대로 넣은 것, status: draft, avoid: [정적 이미지]}
  - {en: test (software), ko: 테스트, status: ruled, avoid: [시험], note: "the author, 2026-10-17: 시험 is an exam; testing software is 테스트 (테스트하다)"}
  - {en: test suite, ko: 테스트 코드, status: ruled, avoid: [테스트 스위트, 스위트], note: "the author asked for a Korean term for 스위트"}
  - {en: release, ko: 배포, status: ruled, avoid: [릴리스], note: "the author, 2026-10-17: 배포 instead of 릴리스. To release is 배포하다; a release is 새 버전 (새 버전이 자주 배포될 것입니다, 새 버전마다 무엇이 바뀌었는지); the released package is 마지막으로 배포된 버전"}
  - {en: assistant (the models' role), ko: 조교, status: ruled, avoid: [조수], note: "the author, 2026-10-17: 조수 is not a good word; 조교, the teaching or research assistant a Korean academic works with"}
  - {en: toolchain, ko: 개발 도구, status: draft, note: "개발 도구(toolchain) at first use"}
  - {en: colophon, ko: 책 끝에 붙이는 제작 정보, status: draft, avoid: [판권면], note: "the author, 2026-10-17, had never heard 판권면; say what it is"}
  - {en: tooltip, ko: "도구 설명; first use 도구 설명(tooltip)", status: ruled, avoid: [말풍선 설명], note: "the author, 2026-10-24: Power BI's term (도구 설명); the text that appears when the pointer rests on a button or a point; not the grammar's 레이블"}
  - {en: database, ko: 데이터베이스, status: ruled, note: "the author, 2026-10-18: first use in each chapter is 데이터베이스(DB)"}
  - {en: query (database), ko: 질의, status: draft, note: "first use 질의(query); 쿼리 is the developers' word — the author to rule"}
  - {en: fixed value, ko: 고정값, status: draft}
  - {en: sentence, ko: 문장, status: ruled, note: "the gog code you write, e.g. data(...) + point + x(gdp); not 설계도, which is what that sentence is (the author, 2026-10-18)"}
  - {en: kernel, ko: 어휘, status: ruled, avoid: [커널, 핵심 어휘, 기본 어휘, 어휘 목록, 사전], note: "the author, 2026-10-17: to most readers 커널 is too new or ambiguous (an operating system's kernel, the kernel of kernel density). The English defines the kernel as the grammar's whole vocabulary, so the plain word carries it: 어휘(kernel) at first use, then 어휘 장, 어휘 카드. Not 핵심 or 기본 어휘 (they imply words beyond the core; there are none), not 어휘 목록 (Wilkinson's inventory), not 사전 (the chart-names appendix)"}
  - {en: atom, ko: 기본 단위, status: ruled, avoid: [원자, 아톰], note: "the author, 2026-10-17: 원자 is too chemical; asked for the linguistic term. Linguistics names its smallest units 단위 (형태소: 뜻을 가진 가장 작은 말의 단위). 기본 단위(atom) at first use; atom family is 기본 단위의 종류. Not 형태소 or 자소 (too technical, and each names a specific unit), not 낱말 or 단어 (단어 is word, and 어휘 is the kernel). In the Hangeul analogy a letter is 낱자. Where a sentence says gog has no word for a chart, name the kind of word the reader looks for: gog에는 `candlestick`이라는 마크가 따로 없습니다, not `candlestick`이라는 기본 단위는 없습니다 (the author, 2026-11-07: 'this is too literal. I think you mean we don't have mark for candlestick?')"}
  - {en: piece, ko: 기본 단위, status: draft, avoid: [조각], note: "the author, 2026-10-17: 조각 is literal. The pieces that compose are the atoms (기본 단위를 조합하다); a piece of a whole is 일부"}
  - {en: default, ko: 기본값, status: ruled, avoid: [기본, 기본적으로], note: "the author, 2026-10-18: 기본 alone reads as basic or foundational skill. A default value is 기본값 (디폴트 also acceptable); by default is 따로 정하지 않으면. 기본 단위 (atom) is a separate, ruled term"}
  - {en: quantile, ko: 분위수, status: draft, note: "standard statistics term (사분위수 quartile, 백분위수 percentile); first use 분위수(quantile), defined where the idea is first explained"}
  - {en: compose, ko: 조합하다, status: draft, note: "for letters, words and atoms; 결합하다 is chemistry's and engineering's. Hangeul letters 모아 쓰다; atoms that combine 함께 쓸 수 있다"}
  - {en: syllable, ko: 음절, status: ruled, note: "the author, 2026-10-17: in the Hangeul passages the unit is the syllable with its three slots (초성, 중성, 종성), 소리를 낼 수 있는 가장 작은 단위, not 단어. English 'word' there is the unit a reader sounds out; in Korean that is the 음절"}
  - {en: "slot (of a syllable)", ko: "초성, 중성, 종성 칸", status: ruled, note: "the author: name the three slots by their Korean names, not 첫 칸, 가운데 칸, 끝 칸"}
  - {en: letter (Hangeul), ko: 낱자, status: draft, note: "a single jamo (ㄱ, ㅏ) in the analogy: 한글에서는 낱자 하나가 기본 단위입니다"}
  - {en: mark, ko: 마크, status: draft, note: "kind name in prose; tier 1 or 3 is the author's ruling; alternative 표지"}
  - {en: channel, ko: 채널, status: draft, note: "kind name in prose"}
  - {en: transform, ko: 변환, status: draft, note: "kind name in prose"}
  - {en: operator, ko: 연산자, status: draft}
  - {en: source, ko: 소스, status: draft, note: "alternatives 원천, 데이터 소스"}
  - {en: refinement, ko: 다듬기, status: draft, note: "alternatives 세부 조정, 수식어"}
  - {en: "binding (the grammar's act)", ko: 연결, status: ruled, avoid: [바인딩], note: "the author, 2026-10-17. A column bound to a channel is 연결(binding) at first use; to bind is 연결하다, or 지정하다 where it reads better (데이터는 data()로 지정합니다, 한 번만 지정하는 데이터). The law's name Bind-Once stays English. A scale goes in the channel's 괄호, not 바인딩 안에"}
  - {en: "binding (a language's package)", ko: 언어별 패키지, status: ruled, avoid: [바인딩], note: "the author, 2026-10-17. The R, Python, Julia and JavaScript bindings are 언어별 패키지(binding) at first use, then 패키지 or 언어별 패키지; never 바인딩, which the grammar's sense also wanted"}
  - {en: mapping, ko: 매핑, status: ruled, avoid: [대응], note: "the author, 2026-10-18: the term Korean data-visualization texts use; 대응 reads as a mathematical correspondence. First use 매핑(mapping). Same act as 연결(binding): 연결 where the point is where something is written, 매핑 where the point is a column rather than a fixed value"}
  - {en: setting, ko: 설정, status: draft}
  - {en: derived by, ko: 도출한, status: draft}
  - {en: refusal, ko: 거부, status: ruled, note: "A sentence is never drawn: the engine draws a graph from it (그 문장으로 그래프를 그리지 않고 거부합니다). the author, 2026-10-17: 거부(refusal) when no better word fits. The noun is the book's concept and is meaningless to a reader who has not seen one, so its first use in each chapter says what happens: 엔진이 문장을 그리지 않고 거부(refusal)합니다. After that, choose the verb by subject: a grammar or script 허용하지 않다; the engine and a sentence 그리지 않다, 받아들이지 않다, or 거부하다; a person's idea 막다. Never the passive 거부되다; the message is 거부 메시지"}
  - {en: legal, ko: 문법에 맞는, status: draft, note: "alternatives 적법한, 올바른"}
  - {en: brush, ko: 브러시, status: draft, note: "brushed plot → 브러시(brush)를 적용한 그래프; alternative 브러싱한 그래프"}
  - {en: card, ko: 카드, status: draft}
  - {en: teaching chapter, ko: 가르치는 장, status: draft, note: "alternatives 학습 장, 본문 장"}
  - {en: the cast, ko: 이 책에 나오는 표, status: draft, avoid: [출연진], note: "the theatre figure read as literal in the author's review of the preface; the rule is 표는 몇 가지만 씁니다"}
  - {en: guide, ko: 가이드, status: draft, note: "alternative 안내 표시"}
  - {en: label, ko: 레이블, status: draft, note: "the grammar's kind; alternative 라벨"}
  - {en: Read it aloud, ko: "소리 내어 읽으면 이렇습니다", status: draft, note: "lead-in; alternative 소리 내어 읽어 봅니다"}
  - {en: formal system, ko: 형식 체계, status: draft}
  - {en: ambition, ko: 목표, status: draft, avoid: [야심], note: "야심 carries greed or self-interest"}
  - {en: aesthetics, ko: 미적 속성, status: draft, note: "Wilkinson's and ggplot2's term"}
  - {en: argument, ko: 인수, status: draft, note: "a function's argument; 인수 also means 'factor', so its English matters at first use"}
  - {en: well-formedness, ko: 적격성, status: draft, note: "Law 8's word"}
  - {en: scope, ko: 범위, status: draft, note: "the book's concept; collides with 지원 범위 for coverage"}
  - {en: discipline, ko: 원칙, status: draft, avoid: [규율], note: "규율 reads as military or school rules; the Hangeul discipline is the principle gog keeps (gog가 지키는 원칙)"}
  - {en: algebra, ko: 대수, status: draft, note: "the author asked for its English at first use"}
  - {en: visual property, ko: 시각적 속성, status: draft, note: "what every channel maps a column to"}
  # Drafts from the grammar chapter (2026-10-18), for the author to rule.
  - {en: "layer", ko: 레이어, status: draft, note: "first use 레이어(layer); one mark and its channels, drawn in the order written"}
  - {en: "arrangement", ko: 배치, status: draft, note: "first use 배치(arrangement); plots joined by | or /"}
