  - {en: "node", ko: 노드, status: draft, note: "first use 노드(node); a network's point"}
  - {en: "edge table", ko: edge 데이터, status: draft, note: "a table with one row per relation; gloss once as 관계마다 행이 하나인 데이터"}
  - {en: "gridlines", ko: 눈금선, status: draft, note: "avoids 격자"}
  - {en: "minimum sentence", ko: 최소 문장, status: draft, note: "first use 최소 문장(minimum sentence)"}
  - {en: "network (graph sense)", ko: 네트워크, status: draft, note: "never 그래프, which is plot"}
  - {en: "editor (RStudio, VS Code)", ko: 편집기, status: draft, note: "where a reader writes code; not 에디터"}
  - {en: "the reader (of this book)", ko: 여러분, status: ruled, avoid: [독자], note: "the author, 2026-10-18: 'I don''t like 독자'. The book''s reader is 여러분 or no subject; a plot''s audience is 그래프를 보는 사람; people in general 사람(들)"}
