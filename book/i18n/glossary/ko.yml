  - {en: "without an axis (read-aloud sentence)", ko: "축 없는", status: draft, note: "y is n without an axis → y는 축 없는 n, as x는 log 척도의 gdp"}
  - {en: "minimum sentence", ko: 최소 문장, status: draft, note: "first use 최소 문장(minimum sentence)"}
