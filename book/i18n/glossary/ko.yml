  - {en: "a shape's area, beside its width and length", ko: "넓이 (area), 폭 (width), 길이 (length)", status: ruled, note: "the author, 2026-11-01, ribbon's violin width section, after reading the default as equal areas: a bare 넓다 reads as a larger area as well as a wider shape, so Europe의 violin이 Africa의 violin보다 넓습니다 said the opposite of the point. Where area and width are both in play, the area is 넓이 and the width is always said with 폭: 폭이 넓다, 폭이 가장 좁다. Then, asked whether 폭 is the vertical height or the left-to-right spread: width is measured across the slot and length along the number axis (넓이 = 평균 폭 × 길이), so the extent along the number axis is 길이, never 범위 (which echoes the range transform) and never 높이 (which reads as vertical whichever way the shape is turned)"}
