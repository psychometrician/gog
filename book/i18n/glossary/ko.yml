# The Korean edition's glossary: one entry per term, edited by hand.
#
# The author's choice is final. Each entry is the English, the Korean the
# edition writes, and an optional note. `avoid:` lists words the edition must
# not write for it (an old choice, a rejected one); the translation check
# flags any chapter that still does.
#
# Three tiers:
#   keep   never translated, written in code font (every word of the grammar,
#          function and argument names, table and column names). `reading` is
#          how the word is said in Korean, which decides the particle after it:
#          `point`를, `bin`을, `x`는.
#   names  proper names kept in English, plain text.
#   gloss  translated by this file. The first use in each chapter adds the
#          English in parentheses: 히스토그램(histogram).
#
# Seeded 2026-10-17 from the two draft chapters (index, first-plot). Every
# entry marked `status: draft` is the translator's choice, not yet the
# author's; the review changes `draft` to `ruled` or edits the entry.

register: 합니다체        # the author, 2026-10-17: like a Korean textbook
questions: "~까요?"      # the author, 2026-10-17: a textbook's question (살까요?), not the strict ~니까?
yes_no: none             # the author, 2026-10-17: never an English "Yes," or "No," opening an answer
first_use: "한국어(English)"   # ruled by the author, 2026-10-17: Korean first, at the first use in each chapter

keep:
  # Every kernel word is in this tier, read from grammar.qmd's kernel table by
  # the check; only the readings that decide a particle are listed here.
  - {en: point, reading: 포인트}
  - {en: bar, reading: 바}
  - {en: bin, reading: 빈}
  - {en: line, reading: 라인}
  - {en: x, reading: 엑스}
  - {en: y, reading: 와이}
  - {en: z, reading: 지}
  - {en: color, reading: 컬러}
  - {en: gog_table(), reading: 지오지 테이블}
  - {en: title(), reading: 타이틀}

names: [gog, GOG, agog, R, Python, Julia, JavaScript, TypeScript, Rust, Quarto,
        JupyterLab, Jupyter, Positron, RStudio, SVG, PNG, GIF, PDF, JSON,
        WebAssembly, ggplot2, lattice, CRAN, PyPI, npm, GitHub, Zenodo,
        r-universe, tidyverse, Canva, React, Supabase, YouTube, Wiley, NCME,
        Wilkinson, Wickham, Tukey, Gosset, Fisher]

gloss:
  # The book's own concepts.
  - {en: specification, ko: 명세, status: ruled, avoid: [스펙, 사양], note: "the author, 2026-10-17. The word statistics already uses (모형 명세, model specification); 스펙 reads as a résumé's or a phone's specs, 사양 as a product's. The English goes with it at the first use in each chapter"}
  - {en: sentence, ko: 문장, status: draft, note: "a gog sentence"}
  - {en: kernel, ko: 어휘, status: ruled, avoid: [커널, 핵심 어휘, 기본 어휘, 어휘 목록, 사전], note: "the author, 2026-10-17: to most readers 커널 is too new or ambiguous (an operating system's kernel, the kernel of kernel density). The English defines the kernel as the grammar's whole vocabulary, so the plain word carries it: 어휘(kernel) at first use, then 어휘 장, 어휘 카드. Not 핵심 or 기본 어휘 (they imply words beyond the core; there are none), not 어휘 목록 (Wilkinson's inventory), not 사전 (the chart-names appendix)"}
  - {en: atom, ko: 기본 단위, status: ruled, avoid: [원자, 아톰], note: "the author, 2026-10-17: 원자 is too chemical; asked for the linguistic term. Linguistics names its smallest units 단위 (형태소: 뜻을 가진 가장 작은 말의 단위). 기본 단위(atom) at first use; atom family is 기본 단위의 종류. Not 형태소 or 자소 (too technical, and each names a specific unit), not 낱말 or 단어 (단어 is word, and 어휘 is the kernel). In the Hangeul analogy a letter is 낱자"}
  - {en: piece, ko: 기본 단위, status: draft, avoid: [조각], note: "the author, 2026-10-17: 조각 is literal. The pieces that compose are the atoms (기본 단위를 조합하다); a piece of a whole is 일부"}
  - {en: compose, ko: 조합하다, status: draft, note: "for letters, words and atoms; 결합하다 is chemistry's and engineering's"}
  - {en: letter (Hangeul), ko: 낱자, status: draft, note: "a single jamo (ㄱ, ㅏ) in the analogy: 한글에서는 낱자 하나가 기본 단위입니다"}
  - {en: mark, ko: 마크, status: draft, note: "kind name in prose; tier 1 or 3 is the author's ruling; alternative 표지"}
  - {en: channel, ko: 채널, status: draft, note: "kind name in prose"}
  - {en: transform, ko: 변환, status: draft, note: "kind name in prose"}
  - {en: operator, ko: 연산자, status: draft}
  - {en: source, ko: 소스, status: draft, note: "alternatives 원천, 데이터 소스"}
  - {en: refinement, ko: 다듬기, status: draft, note: "alternatives 세부 조정, 수식어"}
  - {en: binding, ko: 바인딩, status: draft, note: "also for 'bound'; alternative 묶다/묶임"}
  - {en: mapping, ko: 매핑, status: draft, note: "alternative 대응"}
  - {en: setting, ko: 설정, status: draft}
  - {en: derived by, ko: 도출한, status: draft}
  - {en: refusal, ko: 거부, status: ruled, note: "the author, 2026-10-17: 거부(refusal) when no better word fits. The noun is the book's concept and is meaningless to a reader who has not seen one, so its first use in each chapter says what happens: 엔진이 문장을 그리지 않고 거부(refusal)합니다. After that, choose the verb by subject: a grammar or script 허용하지 않다; the engine and a sentence 그리지 않다, 받아들이지 않다, or 거부하다; a person's idea 막다. Never the passive 거부되다; the message is 거부 메시지"}
  - {en: legal, ko: 문법에 맞는, status: draft, note: "alternatives 적법한, 올바른"}
  - {en: brush, ko: 브러시, status: draft, note: "brushed plot → 브러시(brush)를 적용한 그래프; alternative 브러싱한 그래프"}
  - {en: card, ko: 카드, status: draft}
  - {en: teaching chapter, ko: 가르치는 장, status: draft, note: "alternatives 학습 장, 본문 장"}
  - {en: the cast, ko: 출연진, status: draft, note: "keeps the theatre figure; alternative 이 책의 표들"}
  - {en: guide, ko: 가이드, status: draft, note: "alternative 안내 표시"}
  - {en: label, ko: 레이블, status: draft, note: "the grammar's kind; alternative 라벨"}
  - {en: Read it aloud, ko: "소리 내어 읽으면 이렇습니다", status: draft, note: "lead-in; alternative 소리 내어 읽어 봅니다"}
  - {en: formal system, ko: 형식 체계, status: draft}
  - {en: ambition, ko: 목표, status: draft, avoid: [야심], note: "야심 carries greed or self-interest"}
  - {en: aesthetics, ko: 미적 속성, status: draft, note: "Wilkinson's and ggplot2's term"}
  - {en: argument, ko: 인수, status: draft, note: "a function's argument; 인수 also means 'factor', so its English matters at first use"}
  - {en: well-formedness, ko: 적격성, status: draft, note: "Law 8's word"}
  - {en: scope, ko: 범위, status: draft, note: "the book's concept; collides with 지원 범위 for coverage"}
  - {en: discipline, ko: 규율, status: draft, note: "the Hangeul discipline"}
  - {en: algebra, ko: 대수, status: draft, note: "the author asked for its English at first use"}
  - {en: visual property, ko: 시각적 속성, status: draft, note: "what every channel maps a column to"}
  # The field's terms.
  - {en: long form, ko: 긴 형태, status: draft, note: "a table reshaped long"}
  - {en: plot, ko: 그래프, status: ruled, avoid: [플롯], note: "the author, 2026-10-17. 플롯 also reads as a story's 줄거리, and is the word of people who already code plots; 그래프 is the textbooks' word"}
  - {en: section, ko: 절, status: draft, note: "the textbook word, for the book's structure (장과 절, 절마다). In running prose that points back, Korean writers say 앞에서 or 여기서: \"this section has been describing\" is 앞에서 줄곧 이야기한, not 이 절에서"}
  - {en: figure, ko: 그림, status: draft, note: "a picture on the page, as in 그림 3"}
  - {en: diagram, ko: 시각화 작품, status: draft, note: "the author, 2026-10-17, rejected 도표, which reads as a school chart or table. Name what the thing is in context: a contest entry is 데이터 시각화 작품; a network or chord diagram keeps 다이어그램. A flow diagram is never 흐름도 (a flowchart): 흐름을 그린 그래프", avoid: [도표, 흐름도]}
  - {en: resolution, ko: 해상도, status: draft, note: "where the English says an image is large or high quality"}
  - {en: chart, ko: 차트, status: draft, note: "kept apart from 그래프: the book contrasts a plot with a list of chart types"}
  - {en: table, ko: 표, status: draft, note: "alternative 테이블"}
  - {en: row, ko: 행, status: draft}
  - {en: column, ko: 열, status: draft}
  - {en: position, ko: 위치, status: draft}
  - {en: axis, ko: 축, status: draft}
  - {en: tick, ko: 눈금, status: draft}
  - {en: margin, ko: 여백, status: draft}
  - {en: legend, ko: 범례, status: draft}
  - {en: panel, ko: 패널, status: draft}
  - {en: facet, ko: 패싯, status: draft, note: "alternatives 면 분할, keep `facet`"}
  - {en: scale, ko: 척도, status: draft, note: "log scale → 로그 척도; alternative 스케일"}
  - {en: engine, ko: 엔진, status: draft}
  - {en: grammar, ko: 문법, status: draft}
  - {en: histogram, ko: 히스토그램, status: draft}
  - {en: binning, ko: 구간화, status: draft}
  - {en: quartile, ko: 사분위수, status: draft}
  - {en: median, ko: 중앙값, status: draft}
  - {en: hinge, ko: 힌지, status: draft}
  - {en: whisker, ko: 수염, status: draft}
  - {en: life expectancy, ko: 기대수명, status: draft}
  - {en: wind rose, ko: 바람장미, status: draft}
  - {en: sunburst, ko: 선버스트, status: draft}
  - {en: chord diagram, ko: 코드 다이어그램, status: draft}
  - {en: scribe, ko: 글을 베껴 쓰던 사람, status: draft, avoid: [필경사], note: "the author, 2026-10-17: 필경사 is too difficult and rarely used. Say what the person did"}
  - {en: requirements document, ko: 기획서, status: draft, avoid: [요구사항 문서, 요구사항 명세서], note: "the author, 2026-10-17: 요구사항 is mechanical, a software engineer's word, and 명세 is ruled for specification. The preface's software framing (users, failure, success criterion, performance target) is said in words any reader knows: 누구를 위해, 무엇이 문제인지, 무엇을 이루어야 하는지, 익히는 데 걸리는 시간"}
  - {en: logography, ko: 표어문자, status: draft}
  - {en: featural, ko: 자질문자, status: draft}
  - {en: psychometrician, ko: 계량심리학자, status: draft}
  - {en: color scale, ko: 색 척도, status: draft}
  - {en: drag, ko: 끌기, status: draft, note: "first-plot wrote 끌어서(drag)"}
  # Part and appendix titles.
  - {en: "A morning", ko: 아침나절, status: draft, note: "echoes the postface; alternative 어느 아침"}
  - {en: "The letters", ko: 글자, status: draft}
  - {en: "Sentences", ko: 문장, status: draft}
  - {en: "The cookbook", ko: 쿡북, status: draft, note: "alternative 요리책"}
