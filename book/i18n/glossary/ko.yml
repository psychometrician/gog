  - {en: "the reader (of this book)", ko: 여러분, status: ruled, avoid: [독자], note: "the author, 2026-10-18: 'I don''t like 독자'. The book''s reader is 여러분 or no subject; a plot''s audience is 그래프를 보는 사람; people in general 사람(들)"}
