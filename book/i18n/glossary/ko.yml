  - {en: measurement, ko: 측정값, status: draft, note: "a measured value in general. Where the measure (측정값, the axis) is in the same passage, a measured item is 측정 항목 and its values 잰 값 (line.ko, the iris profile, 2026-10-23)"}
  - {en: "domain (the axis a line, step or area runs along)", ko: 기준 축, status: ruled, avoid: [따라 읽는 축], note: "the author, 2026-10-21: 따라 읽는 축 too literal; first use 기준 축(domain), as the line chapter has it; 기준선 stays baseline"}
  - {en: "measure (the other axis)", ko: 측정값, status: draft, note: "first use 측정값(measure), as the line chapter has it"}
