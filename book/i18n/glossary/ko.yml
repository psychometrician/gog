  - {en: discipline, ko: 원칙, status: draft, avoid: [규율], note: "규율 reads as military or school rules; the Hangeul discipline is the principle gog keeps (gog가 지키는 원칙)"}
  - {en: algebra, ko: 대수, status: draft, note: "the author asked for its English at first use"}
  - {en: visual property, ko: 시각적 속성, status: draft, note: "what every channel maps a column to"}
  # Drafts from the grammar chapter (2026-10-18), for the author to rule.
  - {en: "layer", ko: 레이어, status: draft, note: "first use 레이어(layer); one mark and its channels, drawn in the order written"}
  - {en: "arrangement", ko: 배치, status: draft, note: "first use 배치(arrangement); plots joined by | or /"}
