name = "GrammarOfGraphics"
uuid = "c00c8485-9aac-4319-bba4-e242535f49e2"
authors = ["psychometrician"]
version = "0.1.0"

# Five dependencies, all of them standard libraries, so a user still installs
# nothing extra. Dates is the oldest: Julia is the only binding whose language
# draws R's own `Date` / `POSIXct` distinction, which is the distinction the
# engine's temporal unit needs; JavaScript has one `Date` and has to read the
# unit off the values.
#
# Base64 and Random arrived with the turnable cube. A 3-D plot in an HTML host
# carries the WebAssembly engine, and a notebook has to carry it *inline* to
# survive being emailed — which is a base64 `data:` URI. Random names the
# container the script mounts into, since a page may hold several plots and each
# needs an id of its own.
#
# Downloads and DelimitedFiles are the newest, and they serve `gog_table()`,
# which fetches one of the manual's example tables so a reader can run an example
# without writing a CSV reader first. Both are standard libraries, so the helper
# that makes the book runnable costs a user nothing.
#
# Notably absent: a JSON package. The binding only ever *writes* JSON — the
# engine answers with SVG, not with a document to parse — so `src/json.jl` is a
# small writer rather than a dependency the package would owe compat bounds for.
[deps]
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
Base64 = "2a0f44e3-6c83-55bd-87e4-b1978d98bd5f"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Downloads = "f43a241f-c20a-4ad4-852c-f6b1247861c6"
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"

[compat]
julia = "1.6"

# Test-only. The parity corpus is a JSON document R recorded, and reading it is
# the one thing this repository asks Julia to do that Python and JavaScript get
# from their standard libraries. A dependency confined to `[targets] test` costs
# a user of the package nothing, which is why the writer in `src/json.jl` is
# hand-rolled and this is not: the package must stay clean, the harness need not.
[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
SQLite = "0aa819cd-b072-5ff4-a722-6bc24af294d9"
DBInterface = "a10d1c49-ce27-4219-8d33-6db1a4562965"

[targets]
test = ["Test", "JSON", "SQLite", "DBInterface"]
