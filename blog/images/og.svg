<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffdba4"/>

  <!-- The hex sticker, left, with room to breathe -->
  <image xlink:href="gog-hex.png" x="72" y="95" width="383" height="440"/>

  <!-- Wordmark -->
  <text x="530" y="212" font-family="Helvetica,Arial,sans-serif" font-size="112"
        font-weight="700" fill="#000000" letter-spacing="2">GOG</text>

  <text x="530" y="262" font-family="Helvetica,Arial,sans-serif" font-size="34"
        font-weight="400" fill="#000000">A Grammar of Graphics</text>

  <!-- The sentence: what using it actually looks like -->
  <rect x="530" y="300" width="600" height="86" rx="10" fill="#ffffff" opacity="0.62"/>
  <text x="552" y="334" font-family="Menlo,Consolas,monospace" font-size="21" fill="#000000">data(gapminder) + point +</text>
  <text x="552" y="366" font-family="Menlo,Consolas,monospace" font-size="21" fill="#000000">  x(gdp) + y(life) + color(continent)</text>

  <text x="530" y="440" font-family="Helvetica,Arial,sans-serif" font-size="30"
        font-weight="700" fill="#000000">One engine. Every language.</text>

  <text x="530" y="486" font-family="Helvetica,Arial,sans-serif" font-size="25"
        fill="#3f3629">R  ·  Python  ·  Julia  ·  JavaScript</text>

  <line x1="530" y1="520" x2="1128" y2="520" stroke="#000000" stroke-width="2" opacity="0.28"/>

  <text x="530" y="556" font-family="Helvetica,Arial,sans-serif" font-size="23"
        font-style="italic" fill="#3f3629">Be agog. Use gog.</text>
</svg>
