[package]
name = "gog-cli"
version = "0.5.2"
edition = "2021"
# The floor, and why it is this one: the workspace manifest. The R package's
# `configure` reads this line to tell a user whose Rust is older what to do.
rust-version = "1.75"
license = "Apache-2.0"
description = "Command-line renderer: reads a JSON render-request from stdin, writes SVG to stdout."

[dependencies]
gog-core = { path = "../gog-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The raster half of `--gif`, and deliberately here rather than in `gog-core`:
# a font stack and a rasterizer are a large dependency, and the engine every
# binding's correctness rests on stays at serde. `resvg` reads the SVG this
# binary already produced, so neither crate decides anything about the plot.
#
# Held at 0.45, the last line that builds on Rust 1.75: 0.46 and later need 1.87
# or newer. 0.48 writes the book's GIFs byte for byte the same as 0.45, so the
# hold gives up nothing a plot shows.
#
# Every default feature but `raster-images`, which reads JPEG, WebP and GIF
# pictures embedded in an SVG. The engine never embeds one, and that feature
# brought a second, older `gif` beside the one below plus two image decoders,
# all compiled by every source install. `text` and `system-fonts` are what
# draw the letters in a frame.
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
gif = "0.14"
